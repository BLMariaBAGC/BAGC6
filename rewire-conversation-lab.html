  "soft-skills": "Soft Skills",

const SCENARIOS = [
  { id:"feedback", category:"leadership", title:"Giving Difficult Feedback", desc:"Address underperformance or behaviour with care and directness, without softening to the point of silence.", skills:["Assertiveness","Emotional Reg"], role:"Direct Report", scene:"You have called a 1:1 to address a performance issue that has been building for several weeks. Informal conversations have not shifted anything. The team member sits down already tense, arms folded, ready to explain rather than hear. You need to land the message clearly without triggering a defensive shutdown.", needsFocus:"significance,certainty" },
  { id:"speaking-up", category:"leadership", title:"Speaking Up in a Meeting", desc:"Make your voice heard in a room that tends to talk over or past you.", skills:["Assertiveness","Influence"], role:"Meeting Chair", scene:"You are in a senior leadership meeting. A critical risk has been raised and then talked past. The room is moving toward a decision without properly addressing it. You have been quiet. The meeting chair is about to move on. This is the moment you choose to intervene.", needsFocus:"significance,connection" },
  { id:"address-team", category:"leadership", title:"Addressing Your Team", desc:"Deliver a message to your team with presence and conviction.", skills:["Clarity","Influence"], role:"Team Member", scene:"You have called a team meeting to address a difficult period: restructuring, missed targets or a change in direction. The mood is uncertain. People want to know what it means for them. One team member speaks on behalf of the room and the questions are pointed. You need to lead, not just communicate.", needsFocus:"certainty,connection,contribution" },
  { id:"inspiring-others", category:"leadership", title:"Inspiring Others", desc:"Move people from going through the motions to genuinely believing in what they are working toward.", skills:["Influence","Clarity"], role:"Disengaged Team Member", scene:"A senior team member who used to be your strongest performer has been coasting for months. They are meeting targets technically but the initiative and energy are gone. You have asked for a private conversation. They come in polite but flat. They have heard the motivational speech before. They need something real.", needsFocus:"significance,growth,contribution" },
  { id:"bigger-vision", category:"leadership", title:"Presenting the Bigger Vision", desc:"Articulate where you are going, why it matters and why now.", skills:["Influence","Clarity"], role:"Senior Leadership Group", scene:"You are presenting the strategic direction for your function to the senior leadership group. They are time-poor, financially focused and have heard too many visions that did not deliver. One member of the group is openly sceptical. You have twelve minutes and no room for a slow build.", needsFocus:"significance,contribution,growth" },
  { id:"underperformance-defensive", category:"leadership", title:"Underperformance: The Defensive Response", desc:"Address sustained underperformance with someone who pushes back and deflects blame.", skills:["Assertiveness","Emotional Reg"], role:"Defensive Direct Report", scene:"A team member has been underperforming for two months. Previous check-ins were met with reasons, comparisons to colleagues and reassurances that things would improve. They have not. The team member arrives today already prepared with their defence. They are not a bad person, they are a person who has learned that pushing back works.", needsFocus:"significance,certainty,connection" },
  { id:"underperformance-struggling", category:"leadership", title:"Underperformance: The Struggling Team Member", desc:"Support someone who is genuinely not coping. They are overwhelmed, not unwilling.", skills:["Empathy","Clarity"], role:"Struggling Direct Report", scene:"A usually reliable senior team member has been missing deadlines and producing work below their standard for six weeks. Something is clearly wrong outside of work but they have not said anything. They sit down looking exhausted. They are holding it together by a thread. If you go straight to performance, you will lose them.", needsFocus:"certainty,connection,growth" },
  { id:"underperformance-demotivated", category:"leadership", title:"Underperformance: The Disengaged and Demotivated", desc:"Reconnect someone who has switched off. They are capable. They have simply stopped caring.", skills:["Influence","Empathy"], role:"Demotivated Direct Report", scene:"A highly capable team member has been visibly disengaged for months. The work is technically acceptable but there is no initiative, no energy, no ownership. They were passed over for a promotion eighteen months ago and have never fully recovered. They have heard the 'we value you' conversation before. They do not believe it.", needsFocus:"significance,growth,contribution,variety" },
  { id:"criticism", category:"assertiveness", title:"Responding to Criticism", desc:"Receive feedback under pressure without collapsing, defending or shutting down.", skills:["Emotional Reg","Clarity"], role:"Senior Colleague", scene:"You have been pulled aside after a board presentation by a senior colleague who has significant concerns about your approach. The feedback is pointed, delivered in a corridor, and not entirely fair. You are caught off guard. Your instinct is either to defend or to fold. The colleague is watching to see which one you do.", needsFocus:"significance,certainty" },
  { id:"boundaries-manager", category:"assertiveness", title:"Setting Boundaries with a Manager", desc:"Establish what is and is not acceptable, without jeopardising the relationship.", skills:["Assertiveness","Clarity"], role:"Direct Line Manager", scene:"A pattern of late-evening messages, weekend requests and last-minute changes has been building for three months. You have absorbed it without saying anything. It is now affecting your performance and your health. You have requested a brief conversation. Your manager does not see a problem and is likely to treat this as a loyalty issue rather than a capacity one.", needsFocus:"certainty,significance,connection" },
  { id:"no-to-colleague", category:"assertiveness", title:"Saying No to a Colleague", desc:"Decline a request without guilt, over-explanation or damage to the relationship.", skills:["Assertiveness","Clarity"], role:"Colleague", scene:"A peer is about to ask you to cover a significant piece of work during their absence. You have said yes to this kind of request before and it has cost you. Your workload is already at capacity. The colleague is senior to you socially even if not hierarchically, and they expect yes.", needsFocus:"connection,significance" },
  { id:"challenge-decision", category:"influence", title:"Challenging a Decision", desc:"Push back on a direction you disagree with, without being seen as obstructive.", skills:["Influence","Assertiveness"], role:"Senior Decision Maker", scene:"A strategic decision has been announced at senior level that you believe carries a risk that has not been properly assessed. The decision maker is invested in the direction and has political capital tied to it. You have been given fifteen minutes to raise your concerns. You need to be heard without being dismissed as obstructionist.", needsFocus:"significance,certainty" },
  { id:"present-idea", category:"influence", title:"Presenting an Idea", desc:"Pitch a new idea and navigate the questions, scepticism and pushback that follow.", skills:["Influence","Clarity"], role:"Senior Stakeholder", scene:"You have been given time in a leadership meeting to present a proposal that requires investment and a change in process. The stakeholder opposite you controls the budget, is under pressure to reduce spend, and has seen too many proposals that promised more than they delivered. The questions will be sharp.", needsFocus:"significance,contribution" },
  { id:"active-listening", category:"soft-skills", title:"Practising Active Listening", desc:"Build the habit of truly hearing someone rather than preparing your next response.", skills:["Listening","Empathy"], role:"Colleague sharing a challenge", scene:"A peer has caught you in a quiet moment and asked if you have five minutes. They are carrying something and they rarely ask for help. Your instinct will be to fix, advise or move the conversation forward. This time your only job is to be fully present and to hear them before you say anything at all.", needsFocus:"connection,significance" },
  { id:"receiving-feedback", category:"soft-skills", title:"Receiving Feedback Gracefully", desc:"Take feedback, even feedback you disagree with, without becoming defensive or rattled.", skills:["Emotional Reg","Listening"], role:"Manager giving feedback", scene:"You have been invited to a structured feedback conversation. The feedback covers a recent project where you believe your contribution was strong. The manager has a different view. Some of what they say will be fair. Some will miss important context. Your task is to receive all of it without defending, deflecting or shutting down.", needsFocus:"significance,growth,certainty" },
  { id:"empathetic-conversation", category:"empathy", title:"Having an Empathetic Conversation", desc:"Hold space for someone going through a difficult time, without fixing or minimising.", skills:["Empathy","Listening"], role:"Team Member in distress", scene:"A team member has come to you visibly distressed. Something has happened, professionally or personally, and they are barely holding it together. They do not need a solution. They need to feel that someone senior actually sees them. The instinct to move to action or reassurance is strong. Resist it.", needsFocus:"connection,certainty,significance" },
  { id:"conflict", category:"conflict", title:"Navigating Team Conflict", desc:"Work through interpersonal tension with a colleague directly and constructively.", skills:["Conflict Res","Listening"], role:"Colleague", scene:"Tension with a peer has been building for months through small incidents, missed handoffs and a difference in working styles that has never been directly addressed. It is now affecting joint deliverables and other team members have noticed. You have asked for a direct conversation. The colleague comes in guarded.", needsFocus:"connection,significance,certainty" },
  { id:"conflict-credit", category:"conflict", title:"When Someone Takes Credit for Your Work", desc:"Reclaim your contribution professionally without damaging the relationship or coming across as petty.", skills:["Assertiveness","Clarity"], role:"Colleague who took credit", scene:"In a senior meeting this morning, a colleague presented work that was substantially yours without acknowledgement. It was not subtle and others in the room noticed. You have asked for a brief word. You are still processing the sting of it. The colleague will almost certainly minimise what happened. You need to name it without escalating it.", needsFocus:"significance,connection,certainty" },
  { id:"conflict-mediate", category:"conflict", title:"Mediating Conflict Between Two Team Members", desc:"Hold the space between two people in dispute without taking sides, and move them toward resolution.", skills:["Listening","Empathy"], role:"Two team members in conflict (alternating)", scene:"Two senior team members have reached an impasse that is affecting the whole team's output. Both believe they are right. Both have legitimate grievances. You have brought them into the same room. Your role is to facilitate resolution, not to judge. The moment you take a side you lose both of them.", needsFocus:"connection,certainty,significance" },
  { id:"conflict-public", category:"conflict", title:"Repairing After a Public Disagreement", desc:"Rebuild the relationship after a disagreement that played out in front of others, where pride and embarrassment are now in the room.", skills:["Emotional Reg","Conflict Res"], role:"The other person from the disagreement", scene:"You and a peer clashed openly in a leadership meeting yesterday over a strategic decision. It was pointed, the room noticed, and both of you said things that went further than they needed to. You have asked for a private conversation today. Pride and embarrassment are both in the room. You need to repair without either capitulating or re-litigating.", needsFocus:"significance,connection,certainty" },
  { id:"conflict-senior", category:"conflict", title:"Conflict with Someone More Senior", desc:"Address a disagreement or injustice with someone above you in the hierarchy, where speaking up carries real risk.", skills:["Assertiveness","Emotional Reg"], role:"Senior Manager or Director", scene:"A director has made a decision that has directly affected your team in a way you believe was unjust, and has done so without consultation. You have requested time to speak with them directly. The risk is real: they have influence over your progression. Speaking up anyway, and doing it well, is the point of this session.", needsFocus:"significance,certainty,connection" },
  { id:"conflict-avoided", category:"conflict", title:"The Conversation That Should Have Happened Months Ago", desc:"Finally have the conversation that has been avoided for too long. Resentment has built. Both sides need honesty and accountability.", skills:["Conflict Res","Empathy"], role:"Colleague carrying unresolved tension", scene:"A working relationship with a peer has been quietly deteriorating for the better part of a year. Small frustrations, misread intentions and one significant incident that was never properly addressed have compounded into real distance. You have finally asked for a conversation. The colleague arrives wary. They have been waiting for this too but not with relief.", needsFocus:"connection,significance,growth,certainty" },
  { id:"difficult-client", category:"performance", title:"Handling a Difficult Client", desc:"Hold your professional ground with a client who is frustrated or testing boundaries.", skills:["Assertiveness","Conflict Res"], role:"Difficult Client", scene:"A senior client has escalated their frustration and demanded an urgent call. The complaints are a mix of legitimate concerns and unreasonable expectations. They are used to getting what they want and they are testing whether you will hold your position or fold under pressure. The relationship matters. So does your credibility.", needsFocus:"significance,certainty,connection" },
  { id:"public-speaking", category:"performance", title:"High-Stakes Presentation", desc:"Rehearse how you open, land your key points and handle questions under pressure.", skills:["Clarity","Influence"], role:"Audience Member / Questioner", scene:"You are presenting to a senior audience: board level, executive committee or major client. You have the substance. The challenge is landing it at their register, handling the pressure of the room and not letting a sharp question knock you off your position. This is a full rehearsal including the Q&A that tends to be where things unravel.", needsFocus:"significance,contribution" },
  { id:"promotion", category:"career", title:"Asking for a Promotion", desc:"Make the case for your next step without underselling yourself or over-explaining.", skills:["Assertiveness","Influence"], role:"Line Manager", scene:"You have requested a structured conversation with your line manager about your progression to the next level. You have been performing above your current grade for twelve months. The manager is not unsupportive but they are measured and they will want the case made clearly in the language of business impact, not effort and tenure.", needsFocus:"significance,growth,certainty" },
  { id:"interview", category:"career", title:"Interview Preparation", desc:"Practise articulating your experience, value and thinking under interview conditions.", skills:["Clarity","Influence"], role:"Senior Interviewer", scene:"You are in a senior-level interview for a role one level above your current position. The interviewer is experienced, unhurried and will probe beneath the polished answer to test your actual thinking. Competency questions will be followed by follow-up questions designed to find the edge of what you actually know and can do.", needsFocus:"significance,certainty,growth" },
  { id:"salary", category:"career", title:"Negotiating Salary", desc:"Name your number and hold it, without apologising at the first sign of resistance.", skills:["Assertiveness","Influence"], role:"HR or Hiring Manager", scene:"You have received a written offer that is below your expectation and below your market value. The hiring manager has invited you to discuss the package. The first move they will make is to suggest flexibility is limited. Your task is to state your position clearly, anchor to value rather than need, and hold your ground at the first sign of resistance.", needsFocus:"significance,certainty,growth" },

  // ── ASSERTIVENESS (additional) ──
  { id:"assertiveness-interrupt", category:"assertiveness", title:"Stopping the Interruption Pattern", desc:"Address a colleague who consistently talks over you, before the pattern becomes permanent.", skills:["Assertiveness","Clarity"], role:"Colleague who interrupts", scene:"A peer you work closely with has a habit of finishing your sentences, cutting in before you have made your point, and redirecting the conversation to their own view. It happens in meetings and in 1:1s. You have let it pass each time. You are naming it now, directly, before resentment makes the conversation harder than it needs to be.", needsFocus:"significance,certainty" },
  { id:"assertiveness-credit-manager", category:"assertiveness", title:"Asking for Visible Credit", desc:"Ask your manager to acknowledge your contributions publicly, without sounding defensive or political.", skills:["Assertiveness","Influence"], role:"Direct Line Manager", scene:"Your manager has a pattern of presenting your work as the team's output without attributing it to you specifically. You are not being sidelined deliberately, but the impact is the same. Senior stakeholders do not know what you contribute. You have asked for a conversation. You need to make the ask clearly without sounding precious about credit.", needsFocus:"significance,growth,contribution" },
  { id:"assertiveness-overload", category:"assertiveness", title:"Pushing Back on Workload", desc:"Tell your manager you are at capacity, and make it land without sounding like a complaint.", skills:["Assertiveness","Clarity"], role:"Manager adding to your plate", scene:"You have been asked to take on a fourth significant priority this month. Nothing has been removed to make room for it. You are already working evenings. You need to push back on this one, name your actual capacity, and either get the new task deprioritised or something removed. The manager does not fully see the picture.", needsFocus:"certainty,significance" },
  { id:"assertiveness-disagree-public", category:"assertiveness", title:"Disagreeing in a Group Setting", desc:"Hold your position when the room has moved against you, without caving or creating conflict.", skills:["Assertiveness","Emotional Reg"], role:"Group of Colleagues or Meeting Chair", scene:"You are in a team meeting and a decision is moving toward consensus. You disagree with the direction and believe the group is missing something important. Everyone else seems aligned. Speaking up at this point means going against the momentum of the room. Not speaking up means letting a flawed decision through. You choose to speak.", needsFocus:"significance,certainty,contribution" },
  { id:"assertiveness-unfair-review", category:"assertiveness", title:"Challenging an Unfair Performance Review", desc:"Respond to an assessment you believe is inaccurate, with evidence rather than emotion.", skills:["Assertiveness","Clarity"], role:"Manager who wrote the review", scene:"You have just received a performance review that you believe misrepresents your contribution over the past year. Key achievements have not been acknowledged and the development points do not match the feedback you received throughout the year. You have asked to discuss it. The instinct is to defend everything. The skill is to be precise, evidence-based and calm.", needsFocus:"significance,certainty,growth" },

  // ── INFLUENCE (additional) ──
  { id:"influence-budget", category:"influence", title:"Making the Case for Budget", desc:"Secure investment for something you believe in when the decision-maker is resistant.", skills:["Influence","Clarity"], role:"Budget Holder", scene:"You are requesting a budget that has been turned down informally once already. The decision-maker is cautious with spend and has seen too many proposals that underdelivered. You have one more structured opportunity to make the case. You need to come at it differently this time: from their priorities, not yours.", needsFocus:"certainty,significance,contribution" },
  { id:"influence-no-authority", category:"influence", title:"Influencing Without Authority", desc:"Move people toward a decision or action when you have no formal power over them.", skills:["Influence","Listening"], role:"Peer or Cross-Functional Colleague", scene:"You need a peer in another department to change how they do something that affects your team's work. You have no authority over them. They are not hostile but they have their own priorities and your request is an inconvenience. You need to make the case in terms that make them want to help, not feel obliged to.", needsFocus:"connection,significance,contribution" },
  { id:"influence-narrative", category:"influence", title:"Changing the Narrative", desc:"Reframe how a situation, setback or outcome is being talked about at leadership level.", skills:["Influence","Clarity"], role:"Senior Leader", scene:"A project that ran over time and over budget has been framed in leadership conversations as a failure. You were close to it and you know the full picture is more nuanced. The framing is starting to affect your team's reputation. You have an opportunity to reframe it with a senior stakeholder who has influence over the story.", needsFocus:"significance,certainty,contribution" },
  { id:"influence-resistant", category:"influence", title:"Winning Over a Resistant Stakeholder", desc:"Build support from someone who is not actively opposed but is not in your corner.", skills:["Influence","Empathy"], role:"Sceptical Senior Stakeholder", scene:"A key stakeholder has been passive about your initiative: not blocking it but not championing it either. Their visible support would open doors. Their continued neutrality is costing you. You have a short window with them in a 1:1. You need to understand what is holding them back and give them a reason to move from neutral to active support.", needsFocus:"significance,connection,contribution" },
  { id:"influence-exec-room", category:"influence", title:"Landing a Point in the Executive Room", desc:"Make your contribution count in a high-stakes meeting with senior decision-makers.", skills:["Influence","Clarity"], role:"Executive or Board Member", scene:"You are in a meeting with executives and have been given a slot to contribute on a topic you know well. The room is experienced, time-poor and will form an opinion of you in the first sixty seconds. You have prepared. The challenge is not the substance, it is the register, the pace and the confidence to take up space at this level without over-qualifying everything you say.", needsFocus:"significance,certainty,contribution" },
  { id:"influence-change", category:"influence", title:"Bringing People With You Through Change", desc:"Bring a sceptical team along with a change they did not choose and do not yet trust.", skills:["Influence","Empathy"], role:"Sceptical Team Member", scene:"Your team is being asked to adopt a new way of working that came from above. You did not choose it either. One team member is vocal in their resistance and is influencing others. You need to bring this person with you, not because you can force them, but because you can help them find a reason to engage that is actually theirs.", needsFocus:"certainty,connection,significance,growth" },

  // ── SOFT SKILLS (additional) ──
  { id:"soft-skills-bad-news", category:"soft-skills", title:"Delivering Bad News", desc:"Tell someone something they do not want to hear, with honesty, care and no false comfort.", skills:["Empathy","Clarity"], role:"Team Member or Colleague receiving bad news", scene:"You need to deliver news that will significantly affect someone: a project they cared about has been cancelled, a role they applied for has gone to someone else, or a change has been made that will affect their day-to-day. There is no version of this that does not sting. Your job is to be honest, direct and human, in that order.", needsFocus:"connection,significance,certainty" },
  { id:"soft-skills-apology", category:"soft-skills", title:"Giving a Genuine Apology", desc:"Apologise in a way that actually lands, without over-explaining, deflecting or under-committing.", skills:["Emotional Reg","Empathy"], role:"Person you have let down", scene:"You made a mistake that affected someone else: a missed commitment, a poorly handled conversation or a decision that had consequences you did not anticipate. They know it. You need to apologise in a way that is real. Not defensive, not performative, not hedged with context. Just clear, direct and genuine.", needsFocus:"connection,significance,certainty" },
  { id:"soft-skills-difficult-conversation", category:"soft-skills", title:"Starting a Difficult Conversation", desc:"Open the conversation everyone has been avoiding, without it immediately derailing.", skills:["Assertiveness","Emotional Reg"], role:"Person who needs to hear it", scene:"There is a conversation that has been building for weeks. Both parties know it needs to happen. You are the one who needs to start it. The topic is uncomfortable: a breakdown in working relationship, a pattern of behaviour, or something that was said and never addressed. The longer it waits the harder it gets. You are opening it now.", needsFocus:"certainty,connection,significance" },
  { id:"soft-skills-meeting-management", category:"soft-skills", title:"Managing a Meeting That Is Going Off Track", desc:"Regain control of a conversation that has derailed, without shutting down the room.", skills:["Assertiveness","Clarity"], role:"Meeting Participant who keeps derailing it", scene:"You are chairing a meeting that has been hijacked by a senior participant who keeps taking it off the agenda. Others in the room are frustrated but are deferring to this person's seniority. The original objectives will not be met if things continue this way. You need to steer without being dismissive, and hold the room without a confrontation.", needsFocus:"certainty,significance,contribution" },
  { id:"soft-skills-follow-up", category:"soft-skills", title:"Following Up Without Nagging", desc:"Chase something important without damaging the relationship or coming across as persistent.", skills:["Assertiveness","Listening"], role:"Colleague who has not delivered", scene:"You are waiting on something from a colleague that is blocking your own work. This is the third time you have asked. They are not obstructive, they are stretched. You need to follow up again in a way that gets a result this time, creates some accountability, and does not poison the well for the next piece of work you need to do together.", needsFocus:"certainty,connection,significance" },
  { id:"soft-skills-meeting-contribution", category:"soft-skills", title:"Contributing More in Meetings", desc:"Build the habit of speaking up with more weight and less hedging in group settings.", skills:["Assertiveness","Clarity"], role:"Meeting Chair or Senior Colleague", scene:"You attend meetings where you have relevant expertise but consistently leave without having said the things you prepared to say. You wait too long, the moment passes, or someone else makes the point first and you let it go. This is a rehearsal for speaking up earlier, with more conviction and less over-qualification before you have even made the point.", needsFocus:"significance,certainty,contribution" },

  // ── EMPATHY (additional) ──
  { id:"empathy-grief", category:"empathy", title:"Supporting Someone Through Loss", desc:"Be present with someone who has experienced a bereavement or serious personal loss.", skills:["Empathy","Listening"], role:"Colleague who has experienced a loss", scene:"A colleague has returned to work after a bereavement. They are back because they need routine, not because they are ready. They are managing, but only just. You have a quiet moment with them. You are not their therapist. You are someone who wants to acknowledge what they are carrying without making it about you, without offering empty comfort and without pretending everything is normal.", needsFocus:"connection,certainty,significance" },
  { id:"empathy-anxiety", category:"empathy", title:"Supporting Someone with Anxiety", desc:"Hold a conversation with someone who is struggling with anxiety without minimising or fixing.", skills:["Empathy","Listening"], role:"Team Member or Colleague experiencing anxiety", scene:"A team member has disclosed that they are struggling with anxiety. They have not asked for a solution. They are telling you because they trust you and because they need you to know. Your instinct will be to reassure them that it will be fine, to point them toward resources, or to share your own experience. The skill is to hear them first and fully, before you do anything else.", needsFocus:"connection,certainty,significance" },
  { id:"empathy-burnout", category:"empathy", title:"Recognising and Responding to Burnout", desc:"Have the conversation with someone who is burning out before they reach breaking point.", skills:["Empathy","Assertiveness"], role:"Team Member showing signs of burnout", scene:"A team member has been working at an unsustainable pace for months. The quality of their work has started to dip, they are not taking breaks, and something about the way they are carrying themselves has shifted. They will almost certainly say they are fine. Your job is to create enough safety for them to say something different.", needsFocus:"connection,certainty,significance,growth" },
  { id:"empathy-cultural-difference", category:"empathy", title:"Navigating a Cultural Misunderstanding", desc:"Address a miscommunication that has a cultural dimension, with curiosity rather than assumption.", skills:["Empathy","Listening"], role:"Colleague from a different cultural background", scene:"A misunderstanding has occurred between you and a colleague that you suspect has a cultural dimension: something was communicated in a way that landed differently than intended, on either side. You want to address it directly without making assumptions, without over-labelling it, and without the conversation becoming about blame rather than understanding.", needsFocus:"connection,significance,certainty" },
  { id:"empathy-mental-health", category:"empathy", title:"A Mental Health Conversation", desc:"Open a conversation about someone's wellbeing when you are concerned but they have not spoken up.", skills:["Empathy","Assertiveness"], role:"Colleague you are worried about", scene:"You are concerned about a colleague's mental health. Something has shifted in how they are engaging. They have not said anything. You do not want to overstep but you also do not want to ignore it and have them feel unseen. You are checking in, genuinely, without making them feel pathologised or ambushed.", needsFocus:"connection,certainty,significance" },
  { id:"empathy-celebration", category:"empathy", title:"Recognising Someone Meaningfully", desc:"Acknowledge someone's achievement or contribution in a way that genuinely lands.", skills:["Empathy","Clarity"], role:"Team Member you want to recognise", scene:"A team member did something that deserves genuine recognition: they handled a difficult situation exceptionally, delivered above what was expected or showed a quality that is easy to overlook. Generic praise will not land. You want the acknowledgement to be specific, real and given in a way that they actually receive it, rather than deflect it with modesty.", needsFocus:"significance,connection,contribution" },
  { id:"empathy-transition", category:"empathy", title:"Supporting Someone Through a Career Transition", desc:"Hold a supportive conversation with someone navigating uncertainty about their next step.", skills:["Empathy","Listening"], role:"Colleague at a career crossroads", scene:"A colleague is at a crossroads professionally. They are not sure whether to stay or leave, whether to apply for a promotion or wait, or what they actually want from their career next. They are not looking for you to solve it. They are looking for someone to think alongside them without agenda. Your job is to ask the questions that help them find their own clarity.", needsFocus:"growth,significance,certainty,connection" },

  // ── PERFORMANCE (additional) ──
  { id:"performance-scope-creep", category:"performance", title:"Managing Scope Creep", desc:"Hold the line when a project keeps expanding beyond its original brief.", skills:["Assertiveness","Clarity"], role:"Stakeholder adding to the scope", scene:"A project you are leading has had its scope expanded three times since kick-off. Each time, the addition was presented as small. Cumulatively, the original deliverable is no longer achievable within time or budget. The stakeholder sees each addition as reasonable. You need to name what has happened, state what is achievable and establish a different way of managing change from this point on.", needsFocus:"certainty,significance,contribution" },
  { id:"performance-missed-deadline", category:"performance", title:"Addressing a Missed Deadline", desc:"Have the conversation after something was not delivered on time, without it becoming a blame session.", skills:["Assertiveness","Clarity"], role:"Person who missed the deadline", scene:"A deadline was missed in a way that had consequences: it affected a client, delayed another workstream or damaged your team's credibility with stakeholders. The person responsible is not a poor performer. They are someone who did not communicate the risk early enough. You are having the conversation that establishes what happened, what the impact was and what changes from here.", needsFocus:"certainty,significance,contribution" },
  { id:"performance-stakeholder-complaint", category:"performance", title:"Handling a Stakeholder Complaint", desc:"Respond to a formal or informal complaint about your team's performance with ownership and a clear plan.", skills:["Assertiveness","Empathy"], role:"Dissatisfied Stakeholder or Client", scene:"A stakeholder has escalated a complaint about the quality or timeliness of your team's output. The complaint has merit, even if it is also partly unfair. You are meeting them to acknowledge the issue, own what belongs to you and set out what changes. The temptation is to explain. The skill is to listen first, acknowledge fully and then move to a clear plan.", needsFocus:"certainty,significance,connection" },
  { id:"performance-underdeliver", category:"performance", title:"When You Have Underdelivered", desc:"Own a situation where you did not hit the mark, without excessive self-criticism or deflection.", skills:["Assertiveness","Emotional Reg"], role:"Manager or Senior Stakeholder", scene:"You did not deliver what was expected. The project was late, the output did not meet the standard, or a commitment you made was not kept. You are in a conversation with your manager or a senior stakeholder. The instinct is to explain the context or to over-apologise. The skill is to own it cleanly, be clear about what went wrong and what you are doing differently.", needsFocus:"significance,certainty,growth" },
  { id:"performance-raise-risk", category:"performance", title:"Raising a Risk Before It Becomes a Crisis", desc:"Flag a serious risk early enough to prevent a bigger problem, even when it is uncomfortable.", skills:["Assertiveness","Influence"], role:"Senior Leader or Manager", scene:"You have identified a risk in a project or process that you believe is being underestimated or overlooked. Raising it will disrupt a plan that senior people are committed to. Not raising it carries a greater cost. You have asked for time to surface it formally. The skill is to be clear, specific and solution-oriented without being alarmist, and without backing down if you meet resistance.", needsFocus:"certainty,significance,contribution" },
  { id:"performance-quality-standards", category:"performance", title:"Raising Quality Standards in Your Team", desc:"Set a higher bar for the quality of work your team produces, without demoralising them.", skills:["Assertiveness","Empathy"], role:"Team Member whose work is below standard", scene:"The quality of work coming from your team has been acceptable but not excellent. You want to raise the standard. You are starting with the team member whose output most directly influences the quality of everything else. They are competent and hardworking. The conversation is not about underperformance. It is about what excellent looks like and why it matters now.", needsFocus:"significance,growth,contribution" },

  // ── CAREER (additional) ──
  { id:"career-difficult-manager", category:"career", title:"Navigating a Difficult Manager", desc:"Address a management style that is holding you back, without damaging the relationship.", skills:["Assertiveness","Empathy"], role:"Difficult or Micromanaging Manager", scene:"Your manager has a style that is affecting your performance and your wellbeing: they micromanage, give inconsistent feedback, or consistently take over work you have been asked to lead. You have not raised it directly. You are raising it now. The goal is not to win an argument, it is to establish a different way of working together that gives you the space to do your job.", needsFocus:"significance,certainty,growth" },
  { id:"career-visibility", category:"career", title:"Building Visibility with Senior Leaders", desc:"Have an intentional conversation with a senior leader who does not yet know your work.", skills:["Influence","Assertiveness"], role:"Senior Leader you want to connect with", scene:"A senior leader has influence over your career progression but does not know your work directly. You have a short, informal opportunity to change that: a coffee, a chance meeting or a brief conversation. You do not want to be transactional or sycophantic. You want to have a genuine exchange that leaves them knowing who you are and what you are working on.", needsFocus:"significance,contribution,connection" },
  { id:"career-mentor", category:"career", title:"Asking for a Mentor", desc:"Make a direct request for mentorship from someone senior you respect.", skills:["Assertiveness","Influence"], role:"Senior Person you are asking to mentor you", scene:"There is someone senior whose career and judgment you respect and who you believe could significantly accelerate your development. You want to ask them to be a mentor. You are nervous about asking for their time and not sure how to frame the request so it is clear about what you need and why you are asking them specifically.", needsFocus:"significance,growth,connection" },
  { id:"career-redundancy", category:"career", title:"Responding to Redundancy", desc:"Handle a redundancy conversation with professionalism and clarity, even under shock.", skills:["Emotional Reg","Assertiveness"], role:"HR Representative or Manager delivering redundancy", scene:"You have been called into a meeting and informed that your role is being made redundant. The shock is real. The conversation that follows will establish terms, timelines and next steps. Your ability to stay present, ask the right questions and protect your interests is a skill. This is a rehearsal for that conversation, in a space where it is safe to feel the weight of it.", needsFocus:"certainty,significance,growth" },
  { id:"career-career-change", category:"career", title:"Explaining a Career Change", desc:"Articulate a non-linear career move in a way that makes sense to people who might question it.", skills:["Clarity","Influence"], role:"Interviewer or Senior Colleague", scene:"You are making or considering a career change that does not follow the obvious path: moving sector, stepping sideways, returning after a break or pivoting away from a specialism you built over years. The person in front of you is professional and not unkind, but they do not immediately see the logic. You need to make it coherent, confident and compelling without over-explaining.", needsFocus:"significance,certainty,growth,contribution" },
];

const HUMAN_NEEDS = {
  certainty: "Safety, stability, knowing what to expect",
  variety: "Possibility, change, something to move toward",
  significance: "Mattering, being seen, contribution recognised",
  connection: "Belonging, genuinely heard, supported",
  growth: "Moving forward, developing, not standing still",
  contribution: "Purpose, meaning, impact beyond self",
};

const NEEDS_PROMPT = `HUMAN NEEDS AWARENESS: Every person in a workplace conversation is trying to meet fundamental human needs. Hold all six simultaneously and subtly honour the ones most at risk.
- CERTAINTY: they need safety, to know what happens next. When at risk they become rigid or shut down.
- VARIETY: they need possibility and openness, not dead ends.
- SIGNIFICANCE: they need to feel they matter and are not being written off. Protect this even in difficult conversations.
- CONNECTION: the sense someone is genuinely on their side and they are not alone.
- GROWTH: this conversation should move them forward, not just hold them accountable.
- CONTRIBUTION: their work means something, there is purpose to step up for.
ETHICAL FOUNDATION: This tool exists to build people up. Never corner, shame or win at the expense of the person practising. Even in resistant or dismissive mode, remain a professional who ultimately respects the person opposite you.
LANGUAGE RULE: NEVER use em dashes (the — character) under any circumstances whatsoever. Not once. Not ever. Replace every em dash with a comma, full stop, or colon. This is an absolute rule with no exceptions. Always use the Oxford comma in lists of three or more items (for example: certainty, growth, and contribution).`;

const TONE_INSTRUCTIONS = {
  neutral: "Respond in a measured, realistic way. Be professional and fair but do not make things easy.",
  supportive: "Be open, engaged and collaborative. Create good-faith dialogue, build on their points, and offer help where natural. Still ask meaningful questions so the practice has substance.",
  curious: "Be genuinely interested and ask lots of questions. Probe for detail, reasoning and evidence. Your questions are curious rather than hostile, but they require the person to think and explain clearly.",
  appreciative: "Be positive, warm and encouraging. Acknowledge what they do well within the conversation. Remain realistic: appreciation does not mean agreeing with everything, so still raise honest considerations gently.",
  resistant: "Actively push back. Challenge their points. Be politely resistant and raise objections. Remain professional. If they respond with clarity, evidence and composure, allow your resistance to soften step by step.",
  sceptical: "Be doubtful and need convincing through evidence. Question assumptions, ask for specifics, data or examples. Do not accept assertion alone. When they provide credible substance, acknowledge it and shift your position accordingly.",
  defensive: "Protect yourself and avoid taking responsibility. Justify your actions, shift blame subtly and treat feedback as criticism at first. If the person creates safety, stays specific and avoids attacking you personally, gradually lower your guard and engage honestly.",
  impatient: "Be time-pressed and brisk. Want quick answers, push for the point and occasionally interrupt with phrases like 'So what are you asking for?'. If they are concise and structured, give them proper attention. If they ramble, cut in again. Never be rude, only hurried.",
  dismissive: "Be deflecting and minimising. Downplay what they say, change subject and give non-committal answers. Remain civil. If they hold their ground calmly and make the stakes concrete, begin to take them seriously.",
  "passive-aggressive": "Appear agreeable on the surface while undermining indirectly. Use qualified agreement, faint praise, subtle digs and 'Fine, whatever works for everyone' style remarks. Never be openly hostile. If the person names the pattern calmly and invites honesty without attacking you, drop the mask by degrees and speak plainly.",
  emotional: "You are emotionally charged. Choose ONE emotional lane for the entire scene based on what fits the scenario: frustrated, upset, or angry. Stay in that lane consistently rather than cycling between emotions. Express the emotion through realistic professional behaviour, not theatrics. If the person acknowledges the emotion, stays calm and shows they have heard you, gradually settle and become able to talk constructively.",
  dominant: "Control the conversation. Talk over them, steer the agenda, make declarative statements and leave little room. Remain professional, never abusive. If the person holds their space assertively, interjects with confidence and refuses to be steamrolled, give ground and start treating them as an equal.",
  avoidant: "Do not answer questions directly. Change the subject, give vague replies, defer decisions and slide away from commitment. Remain pleasant. If the person asks precise questions, closes escape routes politely and asks for specific commitments, allow yourself to be pinned down step by step.",
  silent: "Give very little away. Reply in short, minimal answers. Offer no volunteered information, long pauses implied, one sentence at most unless genuinely drawn out. You are not hostile, just closed. If the person asks good open questions, tolerates the silence and creates genuine safety or interest, open up gradually and reward their effort with more.",
};

const TONE_ETHIC = "TONE RULE: Whatever the tone, you are always a character the person can succeed against. There is always a path through. If they communicate well, respond to it. Never become an immovable wall, never punish good communication, and never escalate beyond professional realism.";

function getToneMeta(v) {
  for (const g of TONE_GROUPS) {
    const t = g.tones.find(t => t.value === v);
    if (t) return { ...t, group: g.label };
  }
  return { value: v, label: v, note: "", group: "" };
}

    const url = PROXY_BASE_URL ? `${PROXY_BASE_URL}/api/claude` : "https://api.anthropic.com/v1/messages";
    const res = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },

      .trim();
  }

  // ── SPEECH INPUT ──
  function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Voice input is not supported in this browser. Please use Chrome or Edge.");
      return;
    }
    if (recognitionRef.current) { recognitionRef.current.stop(); }
    const recognition = new SpeechRecognition();
    recognition.continuous = true; // keeps listening through pauses
    recognition.interimResults = true;
    recognition.lang = "en-GB";
    const existingInput = input.trim(); // capture what is already typed
    recognition.onstart = () => setIsListening(true);
    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join("");
      // Append to existing input rather than replacing it
      const combined = existingInput ? existingInput + " " + transcript : transcript;
      setInput(combined);
    };
    recognition.onend = () => { setIsListening(false); };
    recognition.onerror = (e) => {
      if (e.error !== "no-speech") setIsListening(false);
    };
    recognitionRef.current = recognition;
    recognition.start();
  }

  function stopListening(autoSend = false) {
    if (recognitionRef.current) {
      recognitionRef.current.stop();
      recognitionRef.current = null;
    }
    setIsListening(false);
    if (autoSend) {
      setTimeout(sendMessage, 300);
    }
  }

  // ── SPEECH OUTPUT — mirrors Biscuit's proven approach ──
  function stopSpeaking() {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.onended = null;
      audioRef.current.onerror = null;
      audioRef.current = null;
    }
    window.speechSynthesis.cancel();
    setIsSpeaking(false);
  }

  // Biscuit-style: single fetch, play immediately, onended handles state
  // For long narrator text only, we pre-split into sentences and chain them
  async function speakText(text, isNarrator = false) {
    if (!voiceEnabledRef.current) return;
    if (!PROXY_BASE_URL) return;

    // Clean text — strip stage directions and asterisks
    const cleanText = text
      .replace(/\*[^*]*\*/g, "")
      .replace(/\s+/g, " ")
      .trim();
    if (!cleanText) return;

    // Stop anything currently playing — same as Biscuit's stopSpeak()
    stopSpeaking();

    const voiceConfig = isNarrator
      ? NARRATOR_VOICE
      : (VOICE_MAP[scenario?.category] || VOICE_MAP.default)[characterGender];

    setIsSpeaking(true);

    // For short text (character replies) — single call like Biscuit
    // For long text (narrator scene) — split at sentence boundaries and chain
    const MAX_LEN = 800;
    const segments = cleanText.length <= MAX_LEN
      ? [cleanText]
      : (cleanText.match(/[^.!?]+[.!?]+|\S+/g) || [cleanText]).reduce((acc, s) => {
          const last = acc[acc.length - 1];
          if (last && (last + s).length <= MAX_LEN) { acc[acc.length - 1] = last + s; }
          else acc.push(s);
          return acc;
        }, []);

    // Play segments in sequence — fetch next while current is playing
    const playSegment = async (index) => {
      if (index >= segments.length || !voiceEnabledRef.current) {
        setIsSpeaking(false);
        return;
      }
      try {
        const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: segments[index], voice_id: voiceConfig.id })
        });
        if (!response.ok) throw new Error("ElevenLabs error");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audioRef.current = audio;
        audio.onended = () => {
          URL.revokeObjectURL(url);
          playSegment(index + 1); // chain next segment
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          setIsSpeaking(false);
        };
        audio.play();
      } catch {
        setIsSpeaking(false);
      }
    };

    playSegment(0);
  }

  // speakTextAndWait — used in startLab/restartLab to await full completion
  // before moving to next step (narrator must finish before character speaks)
  function speakTextAndWait(text, isNarrator = false) {
    return new Promise((resolve) => {
      if (!voiceEnabledRef.current || !PROXY_BASE_URL) { resolve(); return; }

      const cleanText = text.replace(/\*[^*]*\*/g, "").replace(/\s+/g, " ").trim();
      if (!cleanText) { resolve(); return; }

      stopSpeaking();

      const voiceConfig = isNarrator
        ? NARRATOR_VOICE
        : (VOICE_MAP[scenario?.category] || VOICE_MAP.default)[characterGender];

      setIsSpeaking(true);

      const MAX_LEN = 800;
      const segments = cleanText.length <= MAX_LEN
        ? [cleanText]
        : (cleanText.match(/[^.!?]+[.!?]+|\S+/g) || [cleanText]).reduce((acc, s) => {
            const last = acc[acc.length - 1];
            if (last && (last + s).length <= MAX_LEN) { acc[acc.length - 1] = last + s; }
            else acc.push(s);
            return acc;
          }, []);

      const playSegment = async (index) => {
        if (index >= segments.length || !voiceEnabledRef.current) {
          setIsSpeaking(false);
          resolve();
          return;
        }
        try {
          const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: segments[index], voice_id: voiceConfig.id })
          });
          if (!response.ok) throw new Error("ElevenLabs error");
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audioRef.current = audio;
          audio.onended = () => { URL.revokeObjectURL(url); playSegment(index + 1); };
          audio.onerror = () => { URL.revokeObjectURL(url); setIsSpeaking(false); resolve(); };
          audio.play();
        } catch { setIsSpeaking(false); resolve(); }
      };

      playSegment(0);
    });
  }

  function buildGreetingPrompt(sc, role, ctx, t) {
    const needsList = (sc.needsFocus || "").split(",").map(n => n.trim()).filter(Boolean)
      .map(n => n.charAt(0).toUpperCase() + n.slice(1) + (HUMAN_NEEDS[n] ? ` (${HUMAN_NEEDS[n]})` : "")).join("; ");
    const seniorityCtx = SENIORITY_REGISTER[seniority] || "";
    const genderInstruction = characterGender === "female"
      ? "IMPORTANT: You are playing a FEMALE character. Use she/her. Do not play a male character under any circumstances."
      : "IMPORTANT: You are playing a MALE character. Use he/him. Do not play a female character under any circumstances.";
    const nameInstruction = otherPartyName.trim()
      ? `Your character's name is: ${otherPartyName.trim()}. Use this name when you introduce yourself.`
      : "Do NOT introduce yourself with a name. Do not invent a name. Simply introduce yourself by your role only.";
    return `You are about to play the role of: ${sc.role} in a practice scenario called "${sc.title}".
${genderInstruction}
${nameInstruction}
Before the scene begins, introduce yourself briefly and warmly as the character you will be playing. Keep it to 2-3 sentences. Then ask the person their name so you can address them properly throughout the session. Be natural and human, not robotic. Do not begin the actual scenario yet.
${role ? `The person you will be speaking with works as: ${role}.` : ""}
${seniorityCtx ? `Seniority context: ${seniorityCtx}` : ""}
${ctx ? `What they want to work on: ${ctx}` : ""}
${needsList ? `Primary needs most at risk: ${needsList}.` : ""}
${NEEDS_PROMPT}
Never refer to yourself as an AI. NEVER use em dashes. NEVER use asterisks or stage directions like *pauses* or *takes a breath*. Speak naturally as the character, no action descriptions.`;
  }

  async function startLab() {
    const name = userName.trim() || "You";
    setUserName(name);
    historyRef.current = [];
    setMessages([]);
    setInsights([]);
    setScores({});
    setTranscript("");
    setMsgCount(0);
    setThinking(true);
    setView("lab");

    // Small delay to let React settle the view render before audio starts
    await new Promise(r => setTimeout(r, 300));

    try {
      // Step 1: Narrator reads the scene fully before anything else
      if (voiceEnabledRef.current && scenario?.scene) {
        setMessages([{ type:"note", text:"🎭 Listen to the scene..." }]);
        await speakTextAndWait(scenario.scene, true);
        setMessages([]);
      }
      // Step 2: Only after narrator finishes, fetch the AI greeting
      setThinking(true);
      const greetPrompt = buildGreetingPrompt(scenario, userRole, userContext, tone);
      const reply = await callAI(greetPrompt, [{ role:"user", content:"Begin. Introduce yourself briefly and warmly. Then ask for their name." }]);
      historyRef.current = [{ role:"assistant", content:reply }];
      setMessages([{ type:"ai", text:reply }]);
      setTranscript(`${scenario.role}: ${reply}\n\n`);
      setThinking(false);
      // Step 3: Character speaks — fire and forget like Biscuit
      speakText(reply, false);
    } catch {
      setMessages([{ type:"note", text:"Connection issue. Please try again." }]);
      setThinking(false);
    }
  }

  function buildScenePrompt(sc, role, ctx, t) {
    const needsList = (sc.needsFocus || "").split(",").map(n => n.trim()).filter(Boolean)
      .map(n => n.charAt(0).toUpperCase() + n.slice(1) + (HUMAN_NEEDS[n] ? ` (${HUMAN_NEEDS[n]})` : "")).join("; ");
    const seniorityCtx = SENIORITY_REGISTER[seniority] || "";
    const characterDesc = otherPartyName.trim() ? `${sc.role}, specifically described by the person you are speaking with as: ${otherPartyName.trim()}. Embody this specific description rather than a generic version of the role.` : sc.role;
    return `You are roleplaying as: ${characterDesc}.
Scenario: ${sc.title}.
Scene: ${sc.scene}.
${role ? `The person you are speaking with: ${role}.` : ""}
${seniorityCtx ? `Seniority context: ${seniorityCtx} Calibrate your responses to match this level: the challenges, the stakes and the interpersonal dynamics of someone operating at this level.` : ""}
${ctx ? `What they want to work on: ${ctx}` : ""}
Tone: ${TONE_INSTRUCTIONS[t]}
${TONE_ETHIC}
${needsList ? `Primary needs most at risk in this person: ${needsList}.` : ""}
${NEEDS_PROMPT}
RULES: Stay completely in character. No narration, no stage directions. Keep responses concise and natural (2-4 sentences). Never refer to yourself as an AI. NEVER use em dashes (—) under any circumstances. Replace every em dash with a comma, full stop, or colon. This is absolute. Use the Oxford comma in lists of three or more items.`;
  }

  async function sendMessage() {
    if (thinking || !input.trim() || isSpeaking) return;
    const text = input.trim();
    setInput("");
    const name = userName || "You";
    setMessages(m => [...m, { type:"user", text }]);
    historyRef.current = [...historyRef.current, { role:"user", content:text }];
    // Capture name from early messages if not yet set
    if (msgCount === 0 && !userName.trim()) {
      const words = text.trim().split(/\s+/);
      if (words.length <= 3) setUserName(text.trim());
      else {
        const nameMatch = text.match(/(?:i(?:'m| am)|my name(?:'s| is|:))\s+([A-Z][a-z]+)/i);
        if (nameMatch) setUserName(nameMatch[1]);
      }
    }
    setTranscript(t => t + `${name}: ${text}\n\n`);
    setThinking(true);
    const newCount = msgCount + 1;
    setMsgCount(newCount);

    try {
      // First user message is name exchange - transition into scene after
      const isNameExchange = msgCount === 1;
      const sysPrompt = isNameExchange
        ? buildScenePrompt(scenario, userRole, userContext, tone) + `\n\nThe person has just told you their name. Acknowledge it warmly and naturally, then begin the scenario scene immediately.`
        : buildScenePrompt(scenario, userRole, userContext, tone);
      const reply = await callAI(sysPrompt, historyRef.current.slice(-12));
      historyRef.current = [...historyRef.current, { role:"assistant", content:reply }];
      setMessages(m => [...m, { type:"ai", text:reply }]);
      setTranscript(t => t + `${scenario.role}: ${reply}\n\n`);
      speakText(reply);
      if (newCount % 2 === 0) runAnalysis();
    } catch { setMessages(m => [...m, { type:"note", text:"Connection issue. Please try again." }]); }
    setThinking(false);
  }

  async function runAnalysis() {
    const userMsgs = historyRef.current.filter(m => m.role === "user").map(m => m.content).join("\n\n");
    if (!userMsgs) return;
    const seniorityCtx = SENIORITY_REGISTER[seniority] || "";
    const seniorityLabel = SENIORITY_LEVELS.find(l => l.value === seniority)?.label || "";
    const prompt = `Analyse these messages from someone practising: "${scenario.title}".
Their messages: ${userMsgs}
Context: ${userContext || "Not specified"}
${seniorityCtx ? `They operate at ${seniorityLabel} level. ${seniorityCtx} Score their communication against what excellent performance looks like at this specific level, not a generic standard.` : ""}
The other person is playing a ${getToneMeta(tone).label} tone${getToneMeta(tone).group ? ` (${getToneMeta(tone).group})` : ""}. Credit skill shown in handling this specific behaviour.
Return ONLY valid JSON, no markdown:
{"assertiveness":72,"clarity":68,"emotional":80,"influence":55,"listening":65,"empathy":60,"note":"One specific empowering performance insight in 1-2 sentences. Reference their level if relevant. Direct, warm, forward-looking. Second person."}
Scores 0-100. Honest and calibrated against their seniority level. Frame as capability not criticism. A score of 75 at director level means something different from 75 at manager level.`;

    if (!userMsgs) { setMessages(m => [...m, { type:"note", text:"Have at least one exchange before requesting an insight." }]); return; }

Return ONLY valid JSON:

="sec-title">Primary Development Area</div><div class="card">${d.developmentArea||""}</div></div><div class="section"><div class="sec-title">Human Needs in the Scene</div><div class="needs-note">The needs most at stake for you in this conversation, not targets to meet but signals about what was driving the dynamic.</div><div style="margin-bottom:12px">${needsChips}</div><div class="card">${d.needsAnalysis||""}</div></div><div class="takeaway"><div class="takeaway-label">Take This Into the Real Conversation</div><div class="takeaway-text">${d.takeaway||""}</div></div><div class="section"><div class="sec-title">Next Time in the Lab</div><div class="card">${d.nextStep||""}</div></div>${d.alternativeResponse?`<div class="alt-response"><div class="alt-text">${d.alternativeResponse}</div></div>`:""} ${d.registerNote?`<div class="amber-box"><div class="amber-label">Register Note</div><div class="amber-text">${d.registerNote}</div></div>`:""}<div class="footer"><span>Beyond Limits Made For More &nbsp;|&nbsp; Conversation Lab</span><span>${date}</span></div></div></body></html>`;

            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              {isSpeaking && (
                <button onClick={stopSpeaking} style={{ background:"none", border:"none", color:AMBER, fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer", padding:"2px 6px" }}>
                  ⏹ Stop
                </button>
              )}
              <button
                onClick={isListening ? () => stopListening(true) : startListening}
                disabled={isSpeaking}
                style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${isListening ? "#c0536a" : isSpeaking ? "rgba(61,133,140,0.15)" : "rgba(61,133,140,0.3)"}`, background: isListening ? "rgba(192,83,106,0.15)" : "transparent", color: isListening ? "#c0536a" : isSpeaking ? "rgba(232,244,245,0.3)" : "rgba(232,244,245,0.7)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor: isSpeaking ? "not-allowed" : "pointer", display:"flex", alignItems:"center", gap:5 }}>
                {isListening ? "🔴 Listening..." : isSpeaking ? "⏳ Wait..." : "🎤 Speak"}
              </button>
            </div>
          </div>
        </div>
      </div>
      <div style={s.panel} className="lab-panel">
        <div style={s.panelSection}>
          <div style={s.panelTitle}>Communication Intelligence</div>
          {CI_METRICS.map(m => {
            const val = scores[m.key];
            const barColor = val === undefined ? "rgba(61,133,140,0.3)" : val >= 71 ? "#4caf7d" : val >= 41 ? TEAL : AMBER;
            const scoreColor = val === undefined ? "rgba(232,244,245,0.4)" : val >= 71 ? "#4caf7d" : val >= 41 ? MIST : AMBER;
            return (
              <div key={m.key} style={{ marginBottom:12 }}>
                <div style={s.metricRow}>
                  <span style={s.metricName}>{m.label}</span>
                  <span style={{ ...s.metricScore, color: scoreColor }}>{val ?? "-"}</span>
                </div>
                <div style={s.barTrack}>
                  <div style={{ height:"100%", borderRadius:2, background:barColor, width:`${val || 0}%`, transition:"width 0.8s ease" }} />
                </div>
              </div>
            );
          })}
          <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.85)", lineHeight:1.5, marginTop:4 }}>Scores update every two exchanges. They reflect patterns, not perfection.</div>
        </div>
        <div style={s.panelSection}>
          <div style={s.panelTitle}>Live Performance Insights</div>
          {insights.length === 0 ? <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.7)", fontStyle:"italic" }}>Insights will appear as you work through the scene.</div>
            : insights.map((n, i) => <div key={i} style={s.insightNote}>{n}</div>)}
        </div>
        <div style={s.panelSection}>
          <div style={s.panelTitle}>Voice Settings</div>
          <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.78)", marginBottom:10, lineHeight:1.5 }}>
            {voiceEnabled && !elevenLabsKey && !PROXY_BASE_URL ? "Using browser voice. Character voices need an ElevenLabs connection." : voiceEnabled ? `Character voice active. ${(VOICE_MAP[scenario?.category] || VOICE_MAP.default)[characterGender]?.name || "Voice"} is ready.` : "Voice output is off. Toggle above to enable."}
          </div>
          {voiceEnabled && (
            <>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.1em", textTransform:"uppercase", color:"rgba(232,244,245,0.75)", marginBottom:8 }}>Who are you speaking to?</div>
              <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                <button
                  style={{ flex:1, padding:"8px", borderRadius:6, border:`1px solid ${characterGender==="female"?TEAL:"rgba(61,133,140,0.25)"}`, background: characterGender==="female"?"rgba(61,133,140,0.15)":"transparent", color: characterGender==="female"?MIST:"rgba(232,244,245,0.82)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}
                  onClick={() => setCharacterGender("female")}>
                  Female voice
                </button>
                <button
                  style={{ flex:1, padding:"8px", borderRadius:6, border:`1px solid ${characterGender==="male"?TEAL:"rgba(61,133,140,0.25)"}`, background: characterGender==="male"?"rgba(61,133,140,0.15)":"transparent", color: characterGender==="male"?MIST:"rgba(232,244,245,0.82)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}
                  onClick={() => setCharacterGender("male")}>
                  Male voice
                </button>
              </div>
              {!PROXY_BASE_URL && (
                <input
                  style={{ ...s.fieldInput, fontSize:"clamp(13px, 2.1vw, 17px)", padding:"8px 12px", marginBottom:0 }}
                  placeholder="ElevenLabs API key (optional)"
                  type="password"
                  value={elevenLabsKey}
                  onChange={e => setElevenLabsKey(e.target.value)}
                />
              )}
            </>
          )}
        </div>
        <div style={s.panelSection}>
          <div style={s.panelTitle}>Transcript</div>
          <div style={s.transcriptArea}>{transcript || "Your conversation will appear here."}</div>
          <button style={s.exportBtn} onClick={exportTranscript}>Download transcript</button>
        </div>
      </div>
    </div>
  );

  // ── DEBRIEF ──
  if (view === "debrief") return (
    <div style={s.app}>
      <div style={s.debrief}>
        {debriefLoading ? (
          <div style={{ textAlign:"center", padding:"80px 0" }}>
            <Dots />
            <div style={{ color:"rgba(232,244,245,0.75)", fontSize:"clamp(13px, 2.1vw, 17px)", marginTop:16 }}>Preparing your debrief...</div>
          </div>
        ) : debrief?.error ? (
          <div style={{ textAlign:"center", padding:"80px 0", color:"rgba(232,244,245,0.75)" }}>Could not generate debrief. <button style={s.debriefBtnSecondary} onClick={() => setView("lab")}>Return to Lab</button></div>
        ) : debrief ? (
          <>
            <div style={{ marginBottom:36, paddingBottom:28, borderBottom:`1px solid rgba(61,133,140,0.15)` }}>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.2em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:12 }}>Conversation Lab Debrief</div>
              <div style={s.debriefH1}>{debrief.headline}</div>
              <div style={s.debriefSub}>{scenario?.title} &nbsp;|&nbsp; {debrief.toneLabel ? `${debrief.toneLabel} tone` : ""}{debrief.toneLabel ? " \u00A0|\u00A0 " : ""}{new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Overall Performance</div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.overall}</div></div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Communication Intelligence Scores</div>
              <div style={{ fontSize:"clamp(11px, 1.6vw, 13px)", color:"rgba(232,244,245,0.55)", marginBottom:14, lineHeight:1.5 }}>
                Scores reflect how each skill showed up in this specific conversation, calibrated to your seniority level.
                &nbsp; <span style={{ color:"rgba(212,168,83,0.8)" }}>■</span> 0–40 needs work &nbsp;
                <span style={{ color:TEAL }}>■</span> 41–70 developing &nbsp;
                <span style={{ color:"#4caf7d" }}>■</span> 71–100 strong
              </div>
              <div style={s.debriefScoreGrid}>
                {CI_METRICS.map(m => {
                  const val = debrief.scores?.[m.key] ?? null;
                  const barColor = val === null ? "rgba(61,133,140,0.3)" : val >= 71 ? "#4caf7d" : val >= 41 ? TEAL : AMBER;
                  return (
                    <div key={m.key} style={s.scoreCard}>
                      <div style={s.scoreName}>{m.label}</div>
                      <div style={{ ...s.scoreVal, color: val === null ? "rgba(232,244,245,0.4)" : val >= 71 ? "#4caf7d" : val >= 41 ? MIST : AMBER }}>{val ?? "-"}</div>
                      <div style={s.barTrack}><div style={{ height:"100%", borderRadius:2, background:barColor, width:`${val||0}%` }} /></div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Communication Style</div>
              <div style={s.debriefCard}>
                <div style={{ fontSize:"clamp(16px, 2.4vw, 20px)", fontWeight:400, color:MIST, marginBottom:8, fontFamily:"'Cormorant Garamond', Georgia, serif" }}>{debrief.commStyle}</div>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.styleNotes}</div>
              </div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>What You Did Well</div>
              <div style={s.debriefCard}>
                <ul style={{ paddingLeft:18, listStyle:"disc" }}>
                  {(debrief.strengths||[]).map((s,i) => <li key={i} style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.65, marginBottom:6 }}>{s}</li>)}
                </ul>
              </div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Primary Development Area</div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.developmentArea}</div></div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Human Needs in the Scene</div>
              <div style={{ fontSize:"clamp(12px, 1.7vw, 14px)", color:"rgba(232,244,245,0.55)", marginBottom:14, lineHeight:1.5 }}>
                These are the needs that were most at stake for you in this conversation. Not targets to meet, but signals about what was driving the dynamic.
              </div>
              <div style={s.needsGrid}>
                {Object.entries(HUMAN_NEEDS).map(([key, desc]) => {
                  const active = (debrief.needsMostActive||[]).map(n=>n.toLowerCase()).includes(key);
                  return (
                    <div key={key} style={{ ...s.needChip, ...(active ? s.needChipActive : {}) }}>
                      <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", fontWeight:500, color: active ? MIST : "rgba(232,244,245,0.75)", marginBottom:3 }}>{key.charAt(0).toUpperCase()+key.slice(1)}</div>
                      {active && <div style={{ fontSize:"clamp(11px, 1.5vw, 13px)", color:TEAL }}>Active in scene</div>}
                    </div>
                  );
                })}
              </div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.needsAnalysis}</div></div>
            </div>

            <div style={s.takeaway}>
              <div style={s.takeawayLabel}>Take This Into the Real Conversation</div>
              <div style={s.takeawayText}>{debrief.takeaway}</div>
            </div>

            <div style={{ marginBottom:32 }}>
              <div style={s.debriefSectionTitle}>Next Time in the Lab</div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.nextStep}</div></div>
            </div>

            {debrief.alternativeResponse && (
              <div style={{ marginBottom:32, background:"rgba(61,133,140,0.08)", border:`1px solid rgba(61,133,140,0.25)`, borderRadius:12, padding:"24px 22px" }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:12 }}>A Stronger Version of That Moment</div>
                <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.9)", lineHeight:1.75, fontFamily:"'Cormorant Garamond', Georgia, serif", fontStyle:"italic", marginBottom:16 }}>
                  {debrief.alternativeResponse}
                </div>
                <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                  {voiceEnabled && (
                    <button
                      onClick={() => speakText(debrief.alternativeResponse, true)}
                      style={{ padding:"9px 16px", background:"transparent", border:`1px solid rgba(61,133,140,0.3)`, borderRadius:7, color:"rgba(232,244,245,0.75)", fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(12px, 1.8vw, 15px)", cursor:"pointer" }}>
                      🔊 Hear this read aloud
                    </button>
                  )}
                  <button
                    onClick={restartLab}
                    style={{ padding:"9px 16px", background:TEAL, border:"none", borderRadius:7, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(12px, 1.8vw, 15px)", fontWeight:700, cursor:"pointer" }}>
                    Try again with this in mind →
                  </button>
                </div>
              </div>
            )}

            {debrief.skillsLabModule && (
              <div style={{ marginBottom:32, background:"rgba(212,168,83,0.06)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:12, padding:"22px 20px" }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:10 }}>Build the Foundation in the Skills Lab</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)", lineHeight:1.65 }}>
                  {debrief.skillsLabModule === "leadership" && "Your development area points to Leadership Styles. Go to the Rewire Skills Lab to identify your default style and practise adapting it to different situations."}
                  {debrief.skillsLabModule === "communication" && "Your development area points to Communication Styles. Go to the Rewire Skills Lab to build the vocabulary and drill the patterns that will serve you better."}
                  {debrief.skillsLabModule === "executive" && "Your development area points to Executive Presence. Go to the Rewire Skills Lab to build the register and vocabulary of someone who speaks at boardroom level."}
                  {debrief.skillsLabModule === "thinking" && "Your development area points to Thinking Frameworks. Go to the Rewire Skills Lab to sharpen how you think before you decide, argue or solve."}
                </div>
              </div>
            )}

            {debrief.registerNote && (
              <div style={{ marginBottom:28, padding:"16px 20px", background:"rgba(212,168,83,0.07)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:10 }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:8 }}>Register Note</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)", lineHeight:1.65 }}>{debrief.registerNote}</div>
              </div>
            )}

            <div style={s.debriefActions}>
              <button style={s.debriefBtnPrimary} onClick={restartLab}>Practise Again</button>
              <button style={s.debriefBtnSecondary} onClick={() => exportDebriefPDF(debrief)}>Download Debrief</button>
              <button style={s.debriefBtnSecondary} onClick={() => { stopSpeaking(); setView("lobby"); }}>Choose New Scenario</button>
            </div>
          </>
        ) : null}
      </div>
    </div>
  );

  return null;
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>
