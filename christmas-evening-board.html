<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Explore the Christmas Evening</title><style>

*{box-sizing:border-box}html,body{margin:0}body{background:#123c43;color:#123b2d;font-family:Georgia,'Times New Roman',serif;padding:clamp(8px,2vw,28px)}.board{max-width:1720px;margin:auto;background:radial-gradient(ellipse at 50% 12%,#e3eed1,#c4d9b2 75%,#b7d0a6);border:9px solid #c9ab6b;outline:2px solid #94713d;outline-offset:-13px;border-radius:25px;box-shadow:inset 0 0 0 2px #eed9a1,0 15px 35px #001b1d77;padding:clamp(22px,3vw,50px);position:relative}.stud{position:absolute;top:18px;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8d994,#b88d41 65%,#755425);border:1px solid #997039}.stud.left{left:18px}.stud.right{right:18px}h1{text-align:center;font-size:clamp(27px,4.2vw,60px);font-weight:normal;letter-spacing:.045em;margin:3px 0 13px;line-height:1.2}.rule{width:33%;min-width:150px;max-width:510px;height:2px;background:#ad985d;margin:0 auto 17px}.intro{text-align:center;font-size:clamp(16px,1.85vw,27px);margin:0 0 clamp(26px,3vw,42px)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.5vw,35px);max-width:1260px;margin:auto}.tile{appearance:none;border:1px solid #adc59b;background:#eaf1df;border-radius:19px;padding:14px 14px 17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0;color:#143e2f;font-family:inherit;transition:transform .15s,box-shadow .15s}.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 6px 20px #264c3d3d;outline:none}.picture{width:100%;height:clamp(180px,24vw,300px);background:#0e343b;border:4px double #d5b46e;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.picture img{width:100%;height:100%;object-fit:contain;display:block}.tiletitle{font-size:clamp(17px,2vw,26px);font-weight:bold;letter-spacing:.015em;margin-top:13px;text-align:center}.subtitle{font-size:clamp(14px,1.4vw,19px);margin-top:5px;text-align:center}.overlay{position:fixed;inset:0;width:100vw;height:100dvh;background:#102f31;z-index:2147483000;display:none}.overlay.active{display:flex;flex-direction:column}.overlay iframe{border:0;flex:1;width:100%;height:100%}.close{position:absolute;top:12px;right:15px;border:2px solid #e9d8a5;background:#174d4b;color:#fff4d8;border-radius:22px;padding:9px 16px;font:600 17px Georgia;cursor:pointer;z-index:2}.radio-note{display:none;align-items:center;justify-content:center;text-align:center;color:#fff2d6;flex:1;padding:40px;font-size:23px;flex-direction:column}.radio-note a{color:#f5d68c}@media(max-width:560px){.tiles{grid-template-columns:1fr}.board{padding:24px 15px}.picture{height:220px}.stud{width:15px;height:15px;top:10px}.stud.left{left:10px}.stud.right{right:10px}h1{padding:0 15px;font-size:30px}}

.tiles.one{grid-template-columns:minmax(0,560px);justify-content:center}
.picture img.trumpet{width:78%;height:78%}
</style></head><body><main class="board"><i class="stud left"></i><i class="stud right"></i><h1>EXPLORE THE CHRISTMAS EVENING</h1><div class="rule"></div><p class="intro">A quiet winter evening by the fire</p><div class="tiles one"><button aria-label="THE SOUNDSCAPE" class="tile" type="button"><span class="picture"><img class="trumpet" alt="A golden trumpet" src="https://beyondlimitsnew.s3.eu-west-1.amazonaws.com/1.+RIPPILY/COFFEE+SHOP/Trumpet.png"/></span><span class="tiletitle">THE SOUNDSCAPE</span><span class="subtitle">Music for a winter evening</span></button></div></main></body></html>
