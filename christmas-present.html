<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#fdf3dc;background:radial-gradient(ellipse at 50% 30%,#2a1020 0%,#14070f 70%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vh 5vw;text-align:center;transition:opacity .8s ease}
.hidden{opacity:0;pointer-events:none}
h1{font-size:clamp(20px,4.2vh,40px);font-weight:normal;letter-spacing:.04em;color:#f6d98a;text-shadow:0 0 18px rgba(246,217,138,.35)}
.sub{font-size:clamp(13px,2.2vh,19px);opacity:.88;max-width:34em;line-height:1.5}
input[type=text]{font:inherit;font-size:clamp(15px,2.6vh,22px);padding:1.1vh 1.6vh;width:min(78vw,22em);border-radius:10px;border:2px solid #c99a3b;background:#fff8e6;color:#3a1a14;text-align:center}
input[type=text]::placeholder{color:#a58a63}
.row{display:flex;gap:1.6vh;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:clamp(13px,2.2vh,19px);padding:1vh 2.2vh;border-radius:999px;border:2px solid #c99a3b;background:transparent;color:#fdf3dc;cursor:pointer}
.chip[aria-pressed=true]{background:#c99a3b;color:#2a1020}
.chip:focus-visible,input:focus-visible,#gift:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#gift{background:none;border:0;cursor:pointer;position:relative;width:min(40vw,27vh);aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center}
#gift img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:88%;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
#gift .open{opacity:0;height:100%}
#gift.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4vh)}}
#gift.bob .closed{animation:gp 1.5s ease-in-out infinite}
@keyframes gp{0%,100%{transform:translateX(-50%) scale(1);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 4px rgba(255,214,102,.15))}50%{transform:translateX(-50%) scale(1.08);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,214,102,1))}}
#gift.opened .closed{opacity:0;transition:opacity .25s}
#gift.opened .open{opacity:1;transition:opacity .25s}
.hint{font-size:clamp(12px,1.9vh,16px);opacity:.9}.tap{font-size:clamp(18px,3.4vh,30px);font-weight:bold;color:#ffe9a8;text-shadow:0 0 14px rgba(255,214,102,.75);animation:tapg 1.5s ease-in-out infinite}@keyframes tapg{0%,100%{opacity:.8}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.tap{animation:none}}
.err{color:#ffb4a8;min-height:1.4em;font-size:clamp(12px,2vh,16px)}
#reveal{flex-direction:row;gap:2vw;align-items:flex-end;justify-content:center}
#fc{height:min(86vh,88vw*1.5);max-height:86vh;width:auto;opacity:0;transform:translateY(3vh);transition:opacity 1.2s ease,transform 1.2s ease;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));flex:0 1 auto;min-width:0}
#fc.in{opacity:1;transform:none}
#card{container-type:inline-size;position:relative;flex:1 1 0;max-width:62vw;min-width:0;align-self:center;opacity:0;transition:opacity 1.2s ease .5s}
#card.in{opacity:1}
#card img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
#msg{position:absolute;left:15%;right:15%;top:27%;bottom:38%;text-wrap:balance;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4a2412;line-height:1.38;font-size:clamp(12px,3.3cqw,23px);overflow:hidden}
#msg b{font-weight:normal;font-style:italic;font-size:1.12em;margin-bottom:.5em;color:#7a1d17}
#again{margin-top:1.2vh}
.btn{font:inherit;font-size:clamp(12px,2vh,17px);padding:.9vh 2vh;border-radius:999px;border:2px solid #c99a3b;background:transparent;color:#fdf3dc;cursor:pointer}
#rdr{position:absolute;bottom:0;right:0;z-index:6;width:min(29vw,21vh);transform:translateY(112%);transition:transform .9s cubic-bezier(.2,1.4,.4,1);cursor:pointer;display:none}
#rdr.show{display:block}#rdr.in{transform:translateY(0)}#rdr img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
#nose{position:absolute;width:28%;aspect-ratio:1;left:55.1%;top:31%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.95) 0%,rgba(255,90,55,.92) 24%,rgba(255,45,25,.45) 42%,rgba(255,40,20,0) 60%);pointer-events:none;animation:nose 1.2s ease-in-out infinite}
@keyframes nose{0%,100%{opacity:.08;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
#rdr.wig{animation:wig .5s}@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (orientation:landscape){#rdr{width:min(20vw,30vh)}}
@media (prefers-reduced-motion:reduce){#nose{animation:none}#rdr{transition:none}}
#mute{position:absolute;top:1.6vh;right:1.6vh;z-index:9;display:none}
@media (orientation:portrait){
 #reveal{flex-direction:column;gap:1vh}
 #fc{height:40vh;max-width:90vw;align-self:center}
 #card{width:min(92vw,760px);max-width:92vw;flex:none}
}
@media (prefers-reduced-motion:reduce){#gift.bob,#gift.bob .closed{animation:none}#fc,#card{transition:opacity .3s}}

var M={"child": ["Dear {n}, you are braver than you think and kinder than you know. Keep being you, because the world is brighter with you in it.", "Dear {n}, every time you try something new, you grow a little taller inside. I am very proud of you.", "Dear {n}, a kind word is the best present of all. This year, give a few away and watch how many come back to you.", "Dear {n}, every great thing starts with someone who kept trying. You are on a wonderful path, so keep going, my friend.", "Dear {n}, there is a little star inside you that nobody else has. Let it shine, and it will light the way for others.", "Dear {n}, being gentle is a kind of strength. Look after your friends, look after your family, and look after yourself too.", "Dear {n}, big dreams start small. Imagine something wonderful for next year, then take one tiny step towards it today.", "Dear {n}, you are loved, you are special, and you are exactly the right person to bring a smile to someone this Christmas.", "Dear {n}, I have been watching the snow fall, and every snowflake is different, just like you. There is nobody else in the whole world quite like you.", "Dear {n}, the best gifts do not come in boxes. A hug, a laugh, and a helping hand are worth more than all the presents in my sleigh.", "Dear {n}, whenever you want a little calm, take a slow breath and remember that you are always loved. Someone is thinking of you, even when they are far away.", "Dear {n}, sharing is like lighting a candle from another candle. The light grows bigger, and nobody loses any of theirs.", "Dear {n}, I hear that you have been working hard to be good. Trying your best is always enough for me, and I am so proud of you.", "Dear {n}, if you ever feel small, look up at the stars. Each one shines on its own, and so do you.", "Dear {n}, say thank you to someone today and watch their face light up. Gratitude is one of the best magic spells I know.", "Dear {n}, the reindeer say that the strongest ones are those who help others along. Be that kind of friend.", "Dear {n}, it takes courage to say sorry and courage to forgive. Both make your heart grow bigger.", "Dear {n}, your imagination is a magic door. Open it often, and see where it takes you.", "Dear {n}, ask lots of questions. Curious children grow into wonderful grown-ups who change the world.", "Dear {n}, a smile can be the nicest present of all. You have a beautiful one to give.", "Dear {n}, be proud of the things that make you different. Those are your own special sparkles.", "Dear {n}, bedtime is when dreams get their wings. Close your eyes tonight and dream something wonderful.", "Dear {n}, a little kindness each day is like planting seeds. By next Christmas, you will have a whole garden.", "Dear {n}, you have a big, warm heart, and it makes the whole world feel brighter. Keep sharing it, and the sun will keep shining on you.", "Dear {n}, the elves told me you are a good helper. Helping at home is a gift that makes everyone smile.", "Dear {n}, look after animals, plants, and people. Everything gentle in the world needs someone like you.", "Dear {n}, practise something you love a little every day. Small steps take you further than you would ever guess.", "Dear {n}, you are never too little to make a big difference. Even one kind thing can change someone's whole day.", "Dear {n}, being brave means trying something new with a big smile. You do that wonderfully.", "Dear {n}, I wish you laughter that makes your tummy ache, friends who stay close, and a heart full of warm, cosy light.", "Dear {n}, listen to the people who love you, and listen to your own good heart. Between them, you will always find your way.", "Dear {n}, whenever you give, you receive something too. Notice how happy you feel when you make someone else happy.", "Dear {n}, you are growing taller and wiser every day. I am so pleased to see the lovely person you are becoming.", "Dear {n}, the stars shine brightest on the darkest nights, and you shine just like them. Look up tonight and wave hello.", "Dear {n}, honest hearts are the shiniest ones of all, and yours is sparkling. Keep being the wonderful, truthful you.", "Dear {n}, make something with your own hands this year. A drawing, a song, or a story is a gift nobody else can give.", "Dear {n}, remember that every person you meet is carrying a secret hope. Be gentle, and be the friend they need.", "Dear {n}, may your Christmas be filled with cocoa, giggles, and cuddles, and may your heart be full of wonder all year long.", "Dear {n}, you have a big, kind heart. Look after it, and share it with those who need it most.", "Dear {n}, the secret of Christmas is simple: love given freely is the greatest magic of all. You already know how to do it.", "Dear {n}, {r} says he will be right beside you wherever you go. Look for a little red glow, and know that you are never alone.", "Dear {n}, {r} tells me you are braver than you know. When your heart is ready for something new, imagine his warm, bright glow lighting your way.", "Dear {n}, I have asked {r} to bring you a little courage this Christmas. Tuck it in your pocket, and take it out whenever you like.", "Dear {n}, {r} knows that being different is a kind of magic. So is being you.", "Dear {n}, when you are brave, {r}'s nose glows a little brighter. Tonight, it is shining very brightly for you.", "Dear {n}, {r} and I are watching over you tonight. You are safe, you are loved, and you can sleep peacefully.", "Dear {n}, one tiny light can guide the whole sleigh, and you carry a light like that inside you. {r} can see it shining from the sky.", "Dear {n}, {r} says the bravest thing is helping a friend who feels left out. You have a big, kind heart for exactly that.", "Dear {n}, when you try something new, remember that {r} flies through the night, even in the snow and wind. He is brave, and so are you.", "Dear {n}, {r} sends you a special wish: courage for the big days, giggles for the good days, and a friend beside you every day.", "Dear {n}, I have a secret. When you do something kind, {r}'s nose glows and I hear the bells ring. You have made them ring many times this year.", "Dear {n}, whenever you want a friend, whisper a hello to {r}. He will carry it to me, and I will send you a hug on the wind."], "teen": ["Dear {n}, you do not have to have it all figured out. Keep learning, keep asking questions, and trust that you are growing in the right direction.", "Dear {n}, comparing yourself to others will always steal your joy. Your path is your own, and it is worth walking at your own pace.", "Dear {n}, courage is taking the next step with your heart full of hope. You have more of it than you know.", "Dear {n}, speak to yourself the way you would speak to a dear friend, with kindness and cheer. You deserve it.", "Dear {n}, the people who truly matter will love you as you are. Be kind, be honest, and keep your circle close and good.", "Dear {n}, rest is part of growing. Even the strongest trees stand still through the winter, and then they bloom.", "Dear {n}, your voice matters. Say what you think with respect, and listen to others with an open heart.", "Dear {n}, small, steady habits build extraordinary lives. Start the thing you keep putting off, even for five minutes.", "Dear {n}, you are not behind. There is no schedule for becoming who you are meant to be. Keep going, step by step.", "Dear {n}, every step you take teaches you something wonderful. Your path is full of discoveries, and you are growing with each one.", "Dear {n}, choose friends who make you feel more like yourself, not less. Quality matters far more than quantity.", "Dear {n}, your worth is not measured in likes, grades, or trophies. It is built into who you are, and nobody can take it away.", "Dear {n}, it is brave to ask for help. The strongest people I know reach out when they need to.", "Dear {n}, do not rush to grow up. Enjoy the in-between, because these years shape the person you will become.", "Dear {n}, find one thing you love and give it your full attention. Passion has a way of opening doors you did not know were there.", "Dear {n}, kindness is always in fashion. A simple act of care can light up someone's whole day, and you have plenty to give.", "Dear {n}, your feelings are real, and they are allowed. Talk to someone you trust when they get heavy, because sharing makes them lighter.", "Dear {n}, you have gifts that the world needs. Do not hide them to fit in. Let them shine, even when it feels uncomfortable.", "Dear {n}, nobody is as confident as they look. Most people are quietly hoping to be accepted, just like you. Be the one who welcomes them.", "Dear {n}, protect your sleep, your health, and your peace of mind. They are the foundation for every dream you want to build.", "Dear {n}, your story is still being written, and it is full of wonderful chapters. You hold the pen, and you decide what happens next.", "Dear {n}, learn to say no when you need to, and yes when it scares you a little. That balance is where growth lives.", "Dear {n}, the future is not fixed. Each choice you make today is a brushstroke on a picture that only you can paint.", "Dear {n}, listen more than you speak, and read more than you scroll. Your mind is a wonderful place, so feed it well.", "Dear {n}, you are allowed to change your mind, your look, and your dreams. Becoming yourself is a lifelong adventure.", "Dear {n}, thank the people who have stood by you. A few honest words of gratitude can brighten a whole year for them.", "Dear {n}, when everything feels like too much, shrink the day down. Just do the next small thing, and then the one after that.", "Dear {n}, be proud of your effort, not only your results. Effort is the part that is truly yours.", "Dear {n}, every day brings a fresh start, and you have a lifetime of strength to draw on. That strength is real, and it grows each day.", "Dear {n}, may this Christmas bring you rest, laughter, and a quiet confidence that you are on your way to something wonderful."], "adult": ["Dear {n}, you have carried a great deal this year, and you are still here. Take a moment to be proud of how far you have come.", "Dear {n}, rest is not a reward for finishing everything. It is part of the work. Give yourself permission to pause this Christmas.", "Dear {n}, the love you give often goes unseen, but it is felt. Today, may some of it find its way back to you.", "Dear {n}, you are allowed to start again, at any age and on any day. A new chapter only needs one honest first line.", "Dear {n}, be as patient with yourself as you are with the people you love. You are doing better than you think.", "Dear {n}, the simplest gifts last the longest: time, attention, and a warm word. Share them freely, starting with yourself.", "Dear {n}, you do not need to become someone else, because you are already enough. The qualities you have are the very ones others treasure.", "Dear {n}, may the coming year be gentler, braver, and fuller of the things that truly matter to you. You deserve it.", "Dear {n}, you have been strong for so many people. This Christmas, let someone be strong for you.", "Dear {n}, it is never too late to learn, to forgive, or to begin again. The door is always open, and you hold the key.", "Dear {n}, the small moments are the big ones: a warm cup of tea, a familiar voice, a quiet walk. Notice them, and treasure them.", "Dear {n}, success looks different for everyone. Define it for yourself, and you will find it much sooner.", "Dear {n}, forgive yourself for the things you did not know then. You did the best you could with what you had.", "Dear {n}, the people who love you are not counting your achievements. They love you for simply being you.", "Dear {n}, focus on what is in your hands today. Take it one gentle step at a time, and enjoy the view along the way.", "Dear {n}, courage often looks quiet: getting up again, speaking honestly, trying one more time. You have shown plenty of it.", "Dear {n}, make time this season for the people who matter and the things that feed your soul. Everything else can wait.", "Dear {n}, your kindness has touched more lives than you will ever know. Keep going, because the world is warmer for it.", "Dear {n}, the best moment to begin is now. Start with what you have, and the path will appear as you walk.", "Dear {n}, peace begins in this moment. Breathe, trust, and let it be enough.", "Dear {n}, remember who you were before the world told you who to be. That person is still in there, and they are wonderful.", "Dear {n}, gratitude changes the colour of an ordinary day. Name three good things tonight and notice how your heart softens.", "Dear {n}, you are allowed to outgrow old stories about yourself. Write a new one this year, with more kindness in it.", "Dear {n}, to be a good parent, a good friend, or a good leader, begin by being gentle with yourself. Kindness starts within.", "Dear {n}, a quiet word of encouragement can change a life. Think of who needs yours, and share it this Christmas.", "Dear {n}, healing is not a straight line. Some days will feel like steps back, but you are still moving forward.", "Dear {n}, joy does not need a reason. Dance in the kitchen, laugh out loud, and sing with all your heart. Your inner child will thank you.", "Dear {n}, trust yourself, because you have a wonderful way of finding a path through. Let this season fill you with calm and confidence.", "Dear {n}, give the gift of your full attention to someone today. Put the phone down, look into their eyes, and truly listen.", "Dear {n}, your strength is quiet and steady, and it grows every year. You carry a great deal of wisdom, and it shines in all that you do.", "Dear {n}, you are not too old, too late, or too anything. You are exactly where you need to be to begin what comes next.", "Dear {n}, a warm, cosy Christmas, shared with people you love, is the best kind there is. Let the little things be lovely.", "Dear {n}, think of those who are on their own this season. A message, a call, or an invitation may be the greatest gift they receive.", "Dear {n}, your presence is a present. Simply being there for the people you love matters more than anything you could wrap.", "Dear {n}, every ending makes room for a beginning. If something has closed this year, trust that something kinder is opening.", "Dear {n}, nourish your body, your mind, and your spirit equally. A balanced life is built from small, loving choices.", "Dear {n}, may you walk into the new year lighter, braver, and surrounded by people who see the best in you.", "Dear {n}, wisdom is knowing which battles to leave. Choose peace when you can, and save your fire for what truly matters.", "Dear {n}, in a noisy world, silence is a gift. Find ten quiet minutes this week, and listen to what your heart has been saying.", "Dear {n}, may the light you have shared with others return to you tenfold this Christmas and shine all through the coming year."]};

function tick(){raf=null;cx.clearRect(0,0,cv.width,cv.height);var keep=[];
for(var i=0;i<parts.length;i++){var p=parts[i];
 if(p.t==="s"){p.x+=p.vx;p.y+=p.vy;p.vy+=.06*devicePixelRatio;p.vx*=.985;p.l-=p.d;if(p.l>0){cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.shadowBlur=8*devicePixelRatio;cx.shadowColor=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();keep.push(p)}}
 else{p.p+=.02;p.x+=p.vx+Math.sin(p.p)*.4*devicePixelRatio;p.y+=p.vy;if(p.y>cv.height+10){if(snow){p.y=-10;p.x=Math.random()*cv.width}else continue}cx.globalAlpha=.85;cx.shadowBlur=0;cx.fillStyle="#fff";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();keep.push(p)}}
parts=keep;cx.globalAlpha=1;if(parts.length)raf=requestAnimationFrame(tick)}

function pick(g){var L=M[g],key="rw_gift_"+g,used=[],ok=true;
 try{used=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){ok=false;used=(pick.mem=pick.mem||{})[g]||[]}
 if(!(used instanceof Array)||used.length>=L.length)used=[];
 var free=[];for(var i=0;i<L.length;i++)if(used.indexOf(i)<0)free.push(i);
 var c=free[Math.floor(Math.random()*free.length)];used.push(c);
 try{localStorage.setItem(key,JSON.stringify(used))}catch(e){(pick.mem=pick.mem||{})[g]=used}
 return L[c]}
function fitMsg(){var m=$("msg");m.style.fontSize="";var fs=parseFloat(getComputedStyle(m).fontSize);while(m.scrollHeight>m.clientHeight+1&&fs>9){fs-=.5;m.style.fontSize=fs+"px"}}
addEventListener("resize",function(){if(!$("reveal").classList.contains("hidden"))fitMsg()});
/* open */
$("gift").onclick=function(){
 var name=$("nm").value.replace(/[<>&",]/g,"").trim();
 if(!name){$("err").textContent="Please type a first name.";$("nm").focus();return}
 if(!grp){$("err").textContent="Please choose who the gift is for.";return}
 var g=$("gift");g.classList.remove("bob");g.classList.add("opened");g.disabled=true;
 var r=g.getBoundingClientRect();burst((r.left+r.width/2)*devicePixelRatio,(r.top+r.height*.4)*devicePixelRatio);
 if(CFG.music&&!audio){try{audio=new Audio(CFG.music);audio.loop=true;audio.volume=.45;audio.play().catch(function(){});$("mute").style.display="block"}catch(e){}}
 setTimeout(function(){
  $("s1").classList.add("hidden");$("reveal").classList.remove("hidden");$("endbar").classList.remove("hidden");
  var txt=pick(grp).replace(/\{n\}/g,name).replace(/\{r\}/g,CFG.reindeer);
  var parts2=txt.split(", ");var greet=parts2.shift()+",";
  $("msg").innerHTML="";var b=document.createElement("b");b.textContent=greet;var s=document.createElement("span");var rest=parts2.join(", ");s.textContent=rest.charAt(0).toUpperCase()+rest.slice(1);$("msg").appendChild(b);$("msg").appendChild(s);fitMsg();
  setTimeout(function(){$("fc").classList.add("in")},150);setTimeout(function(){$("card").classList.add("in")},350);
  startSnow();burst(innerWidth*devicePixelRatio*.3,innerHeight*devicePixelRatio*.5);
  if(grp==="child"){var rd=$("rdr");rd.classList.add("show");setTimeout(function(){rd.classList.add("in")},reduce?100:900)}
 },reduce?200:1100);
};
$("rdr").onclick=function(){var r=this;r.classList.remove("wig");void r.offsetWidth;r.classList.add("wig");var b=r.getBoundingClientRect();burst((b.left+b.width*.7)*devicePixelRatio,(b.top+b.height*.45)*devicePixelRatio)};

 $("reveal").classList.add("hidden");$("endbar").classList.add("hidden");$("fc").classList.remove("in");$("card").classList.remove("in");
 var g=$("gift");g.classList.remove("opened");g.classList.add("bob");g.disabled=false;$("nm").value="";grp=null;
 for(var j=0;j<chips.length;j++)chips[j].setAttribute("aria-pressed","false");
 $("s1").classList.remove("hidden");snow=false;
};
