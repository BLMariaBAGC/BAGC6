  async function callAI(systemPrompt, msgs) {
    const url = PROXY_BASE_URL ? `${PROXY_BASE_URL}/api/claude` : "https://api.anthropic.com/v1/messages";
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: msgs
      })
    });
    const data = await res.json();
    const raw = data.content?.find(b => b.type === "text")?.text || "";
    return raw.replace(/\s*—\s*/g, ", ").replace(/\*\*([^*]*)\*\*/g, "$1").replace(/\*([^*]*)\*/g, "$1").replace(/,\s*,/g, ",");
  }

  // ── VOICE ──
  function beginRecognitionSession() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.continuous = true; // keeps listening through pauses — see merge logic below for why this is now safe
    r.interimResults = true;
    r.lang = "en-GB";
    r.onstart = () => { setIsListening(true); setVoiceError(""); };
    // This engine sometimes marks a growing restatement of the SAME utterance as
    // "final" more than once ("how" -> "how you" -> "how you doing"), and sometimes
    // marks a genuinely NEW, separate chunk as final. Those need opposite handling: a
    // restatement should REPLACE what came before, new content should be APPENDED.
    // Check whether the new text starts with what we already have: if so it's a
    // restatement, replace; if not, it's new, append rather than risk dropping it.
    let instanceFinal = "";
    r.onresult = e => {
      if (!e.results.length) return;
      const last = e.results[e.results.length - 1];
      const text = last[0].transcript.trim();
      if (last.isFinal && text) {
        const prevLower = instanceFinal.toLowerCase();
        const textLower = text.toLowerCase();
        if (!instanceFinal || textLower.startsWith(prevLower)) {
          instanceFinal = text; // restatement (or first chunk) — replace
        } else {
          instanceFinal = instanceFinal + " " + text; // not a clean restatement — append, never drop
        }
      }
      const interimPart = last.isFinal ? "" : text;
      const combined = [baseInputRef.current, sessionFinalRef.current, instanceFinal, interimPart].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
      setInput(combined);
      voiceInputRef.current = combined;
    };
    r.onend = () => {
      if (instanceFinal) {
        sessionFinalRef.current = sessionFinalRef.current ? sessionFinalRef.current + " " + instanceFinal : instanceFinal;
      }
      if (manualStopRef.current) {
        setIsListening(false);
        if (autoSendRef.current) {
          autoSendRef.current = false;
          const finalText = voiceInputRef.current.trim();
          if (finalText) sendMessageRef.current(finalText);
        }
      } else {
        // Belt-and-braces: some mobile browsers end a "continuous" session on their own
        // after a pause regardless of the flag above. If the person hasn't pressed
        // Stop, silently resume rather than going dead. With continuous:true this
        // should be rare in normal use, keeping handoff-gap word loss rare too.
        beginRecognitionSession();
      }
    };
    r.onerror = e => {
      if (e.error === "no-speech") return;
      if (!manualStopRef.current && (e.error === "aborted" || e.error === "network")) return;
      manualStopRef.current = true;
      setIsListening(false);
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setVoiceError("Microphone access was denied. Please allow microphone access in your browser settings, or switch to Text Practice.");
      } else if (e.error === "audio-capture") {
        setVoiceError("No microphone was found on this device. You can still use Text Practice.");
      } else if (e.error === "network") {
        setVoiceError("Voice recognition lost its connection. Please try again, or switch to Text Practice.");
      } else {
        setVoiceError("Voice input isn't working right now. Please try again, or switch to Text Practice.");
      }
    };
    recognitionRef.current = r;
    r.start();
  }
  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setVoiceError("Voice input isn't supported in this browser. It works best in Chrome, Edge or Samsung Internet — or switch to Text Practice.");
      return;

    setVoiceError("");

  function stopListening(autoSend = false) {
    autoSendRef.current = autoSend;

  function chunkText(text, maxLen = 900) {
    const sentences = text.match(/[^.!?]+[.!?]+|\S+/g) || [text];
    const chunks = [];
    let current = "";
    for (const s of sentences) {
      if ((current + s).length > maxLen && current.length > 0) {
        chunks.push(current.trim());
        current = s;
      } else current += s;
    }
    if (current.trim()) chunks.push(current.trim());
    return chunks;
  }
  function stopSpeaking() {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.onended = null;
      audioRef.current = null;
    }
    window.speechSynthesis.cancel();
    setIsSpeaking(false);
  }
  async function speakText(text, isNarrator = false) {
    if (!voiceEnabledRef.current) return;
    if (!PROXY_BASE_URL) return;
    const cleanText = text.replace(/\*[^*]*\*/g, "").replace(/\s+/g, " ").trim();
    if (!cleanText) return;
    stopSpeaking();
    const voiceConfig = isNarrator ? NARRATOR_VOICE : (VOICE_MAP[activeModule?.id] || VOICE_MAP.default)[characterGender];
    const segments = chunkText(cleanText);
    setIsSpeaking(true);
    const playSegment = async index => {
      if (index >= segments.length || !voiceEnabledRef.current) {
        setIsSpeaking(false);
        return;
      }
      try {
        const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: segments[index],
            voice_id: voiceConfig.id
          })
        });
        if (!response.ok) throw new Error();
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audioRef.current = audio;
        audio.onended = () => {
          URL.revokeObjectURL(url);
          playSegment(index + 1);
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          setIsSpeaking(false);
        };
        audio.play();
      } catch {
        setIsSpeaking(false);
      }
    };
    playSegment(0);
  }
  function speakTextAndWait(text, isNarrator = false) {
    return new Promise(resolve => {
      if (!voiceEnabledRef.current || !PROXY_BASE_URL) {
        resolve();
        return;
      }
      const cleanText = text.replace(/\*[^*]*\*/g, "").replace(/\s+/g, " ").trim();
      if (!cleanText) {
        resolve();
        return;
      }
      stopSpeaking();
      const voiceConfig = isNarrator ? NARRATOR_VOICE : (VOICE_MAP[activeModule?.id] || VOICE_MAP.default)[characterGender];
      const segments = chunkText(cleanText);
      setIsSpeaking(true);
      const playSegment = async index => {
        if (index >= segments.length || !voiceEnabledRef.current) {
          setIsSpeaking(false);
          resolve();
          return;
        }
        try {
          const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {

            },
            body: JSON.stringify({

            })
          });
          if (!response.ok) throw new Error();
          const blob = await response.blob();

          const audio = new Audio(url);

            playSegment(index + 1);
          };

            setIsSpeaking(false);
            resolve();
          };
          audio.play();
        } catch {

        }
      };
      playSegment(0);
    });
  }
