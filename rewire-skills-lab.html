function VocabCardDeck({ category, index, setIndex, flipped, setFlipped, marked, setMarked, completed, setCompleted, onBack, onDone, vocabCards, vocabCategories }) {
  const [mode, setMode] = React.useState("full"); // "full" | "hard" | "done"
  const [hardIndex, setHardIndex] = React.useState(0);
  const [hardFlipped, setHardFlipped] = React.useState(false);
  const [hardCompleted, setHardCompleted] = React.useState([]);

  // Use passed-in arrays or fall back to VOCAB_CARDS/VOCAB_CATEGORIES for Executive Presence
  const cardSource = vocabCards || VOCAB_CARDS;
  const catSource = vocabCategories || VOCAB_CATEGORIES;

  const allCards = cardSource.filter(c => c.category === category);
  const catInfo = catSource.find(c => c.id === category);
  const hardCards = allCards.filter(c => marked.includes(c.id));

  const cards = mode === "hard" ? hardCards : allCards;
  const currentIndex = mode === "hard" ? hardIndex : index;
  const currentFlipped = mode === "hard" ? hardFlipped : flipped;
  const setCurrentFlipped = mode === "hard" ? setHardFlipped : setFlipped;
  const card = cards[currentIndex];
  const isTerminology = category === "terminology";

  function markComplete(id) {
    if (mode === "hard") setHardCompleted(c => c.includes(id) ? c : [...c, id]);
    else setCompleted(c => c.includes(id) ? c : [...c, id]);
  }

  function next() {
    if (!card) return;
    markComplete(card.id);
    setCurrentFlipped(false);
    if (mode === "hard") {
      if (hardIndex < hardCards.length - 1) setHardIndex(i => i + 1);
      else setMode("done");
    } else {
      if (index < allCards.length - 1) setIndex(i => i + 1);
      else setMode("done");
    }
  }

  function toggleMark() {
    if (!card) return;
    setMarked(m => m.includes(card.id) ? m.filter(x => x !== card.id) : [...m, card.id]);
  }

  // End screen
  if (mode === "done") {
    const stillHard = hardCards.length > 0 ? marked.filter(id => allCards.find(c => c.id === id)) : marked.filter(id => allCards.find(c => c.id === id));
    return (
      <div>
        <div style={{ textAlign:"center", padding:"32px 0 24px" }}>
          <div style={{ fontSize:"clamp(24px, 3.6vw, 32px)", marginBottom:12 }}>✓</div>
          <div style={{ fontSize:"clamp(18px, 2.6vw, 22px)", fontWeight:300, color:MIST, fontFamily:"'Cormorant Garamond', Georgia, serif", marginBottom:8 }}>
            Deck complete
          </div>
          <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)", lineHeight:1.6 }}>
            {allCards.length} cards covered.{stillHard.length > 0 ? ` You marked ${stillHard.length} as still hard.` : " No cards marked as still hard."}
          </div>
        </div>

        {stillHard.length > 0 && (
          <div style={{ marginBottom:16, padding:"16px 18px", background:"rgba(212,168,83,0.07)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:10 }}>
            <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.15em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:8 }}>Still Hard</div>
            <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.7)", lineHeight:1.6, marginBottom:16 }}>
              {stillHard.length === 1 ? "1 card" : `${stillHard.length} cards`} did not stick yet. Run through them again before you move to a scenario drill.
            </div>
            <button
              style={{ width:"100%", padding:"13px", background:AMBER, border:"none", borderRadius:8, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", fontWeight:700, cursor:"pointer" }}
              onClick={() => { setMode("hard"); setHardIndex(0); setHardFlipped(false); setHardCompleted([]); }}>
              Practise Hard Cards ({stillHard.length})
            </button>
          </div>
        )}

        <div style={{ display:"flex", gap:10 }}>
          <button
            style={{ flex:1, padding:"13px", background:"transparent", border:`1px solid rgba(61,133,140,0.3)`, borderRadius:8, color:"rgba(232,244,245,0.7)", fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", cursor:"pointer" }}
            onClick={() => { setMode("full"); setIndex(0); setFlipped(false); setMarked([]); setCompleted([]); }}>
            Restart Deck
          </button>
          <button
            style={{ flex:1, padding:"13px", background:TEAL, border:"none", borderRadius:8, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", fontWeight:700, cursor:"pointer" }}
            onClick={onDone}>
            {stillHard.length === 0 ? "Practise a Scenario →" : "Skip to Scenario →"}
          </button>
        </div>
      </div>
    );
  }

  if (!card) return null;
  const isMarked = marked.includes(card.id);
  const progressPct = mode === "hard"
    ? ((hardIndex + 1) / hardCards.length) * 100
    : ((index + 1) / allCards.length) * 100;

  return (
    <div>
      <button style={{ background:"none", border:"none", color:"rgba(232,244,245,0.75)", fontSize:"clamp(14px, 2.2vw, 18px)", cursor:"pointer", marginBottom:16, padding:0 }} onClick={onBack}>← Choose a different category</button>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color: mode === "hard" ? AMBER : TEAL, fontWeight:600 }}>
          {mode === "hard" ? `Hard Cards — ${catInfo?.label}` : catInfo?.label}
        </div>
        <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)" }}>{currentIndex + 1} of {cards.length}</div>
      </div>

      <div
        onClick={() => setCurrentFlipped(f => !f)}
        style={{
          minHeight:180, background: currentFlipped ? "rgba(61,133,140,0.14)" : "rgba(61,133,140,0.06)",
          border:`1px solid ${currentFlipped ? TEAL : "rgba(61,133,140,0.2)"}`, borderRadius:14, padding:"28px 24px",
          cursor:"pointer", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center",
          textAlign:"center", transition:"all 0.25s ease", marginBottom:16
        }}>
        {!currentFlipped ? (
          <>
            <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.14em", textTransform:"uppercase", color:"rgba(232,244,245,0.85)", marginBottom:14 }}>
              {isTerminology ? "Term" : "What you might say"}
            </div>
            <div style={{ fontSize:"clamp(16px, 2.4vw, 20px)", fontWeight:400, color:"#EEF8F9", lineHeight:1.5, fontFamily:"'Cormorant Garamond', Georgia, serif" }}>
              "{card.trivial}"
            </div>
            <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.82)", marginTop:18 }}>Tap to reveal</div>
          </>
        ) : (
          <>
            <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.14em", textTransform:"uppercase", color:AMBER, marginBottom:14 }}>
              {isTerminology ? "What It Means" : "Boardroom Equivalent"}
            </div>
            <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", fontWeight:400, color:MIST, lineHeight:1.55, fontFamily:"'Cormorant Garamond', Georgia, serif", marginBottom:14 }}>
              {card.exec}
            </div>
            {card.note && (
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.82)", lineHeight:1.5, fontStyle:"italic" }}>{card.note}</div>
            )}
          </>
        )}
      </div>

      <div style={{ display:"flex", gap:10 }}>
        <button
          style={{ flex:1, padding:"12px", background:"transparent", border:`1px solid ${isMarked ? AMBER : "rgba(61,133,140,0.3)"}`, borderRadius:8, color: isMarked ? AMBER : "rgba(232,244,245,0.7)", fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(14px, 2.2vw, 18px)", cursor:"pointer" }}
          onClick={toggleMark}>
          {isMarked ? "★ Marked: still hard" : "☆ Mark as still hard"}
        </button>
        <button
          style={{ flex:1, padding:"12px", background:TEAL, border:"none", borderRadius:8, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(14px, 2.2vw, 18px)", fontWeight:700, cursor:"pointer" }}
          onClick={next}>
          {currentIndex < cards.length - 1 ? "Next Card →" : "Finish Deck"}
        </button>
      </div>

      <div style={{ marginTop:16, height:3, background:"rgba(255,255,255,0.07)", borderRadius:2, overflow:"hidden" }}>
        <div style={{ height:"100%", borderRadius:2, background: mode === "hard" ? AMBER : TEAL, width:`${progressPct}%`, transition:"width 0.4s ease" }} />
      </div>
    </div>
  );
}

      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system:systemPrompt, messages:msgs })
    });
    const data = await res.json();
    return data.content?.find(b => b.type === "text")?.text || "";

  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (recognitionRef.current) recognitionRef.current.stop();
    const r = new SR();
    r.continuous = false; r.interimResults = true; r.lang = "en-GB";
    r.onstart = () => setIsListening(true);
    r.onresult = e => setInput(Array.from(e.results).map(r=>r[0].transcript).join(""));
    r.onend = () => setIsListening(false);
    r.onerror = () => setIsListening(false);
    recognitionRef.current = r;
    r.start();

    if (!elevenLabsKey && !PROXY_BASE_URL) {
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = "en-GB"; utt.rate = 0.95;
      window.speechSynthesis.speak(utt);
      return;
    }
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    window.speechSynthesis.cancel();
    setIsSpeaking(true);
    try {
      let response;
      if (PROXY_BASE_URL) {
        response = await fetch(`${PROXY_BASE_URL}/api/elevenlabs`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ text, voiceId: voiceConfig.id })
        });
      } else {
        response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceConfig.id}/stream`, {
          method:"POST",
          headers:{ "Content-Type":"application/json", "xi-api-key": elevenLabsKey },
          body: JSON.stringify({ text, model_id:"eleven_turbo_v2", voice_settings:{ stability:0.5, similarity_boost:0.75, style:0.3, use_speaker_boost:true } })
        });
      }
      if (!response.ok) throw new Error();
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audioRef.current = audio;
      audio.onended = () => { setIsSpeaking(false); URL.revokeObjectURL(url); };
      audio.onerror = () => setIsSpeaking(false);
      audio.play();
    } catch { setIsSpeaking(false); }
  }

  function stopSpeaking() {
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }

    setIsSpeaking(false);

  // ── DRILL LOGIC ──
  function getCurrentDrillInfo() {
    if (!activeModule) return null;

      return LEADERSHIP_STYLES.find(ls => ls.id === selectedStyle)?.drill;

    if (activeModule?.id === "leadership") return LEADERSHIP_STYLES.find(ls => ls.id === selectedStyle)?.label || "";
    if (activeModule?.id === "communication") return COMM_STYLES.find(cs => cs.id === selectedStyle)?.label || "";
    if (activeModule?.id === "executive") return EXEC_SCENARIOS.find(es => es.id === selectedScenario)?.label || "";
    if (activeModule?.id === "thinking") return THINKING_FRAMEWORKS.find(tf => tf.id === selectedFramework)?.label || "";

    if (activeModule?.id === "thinking") {

      return buildThinkingDiagnosticPrompt(fw?.label || "", fw?.teachingFocus || "", userName, userRole, userContext, seniority);

      .map(n => n.charAt(0).toUpperCase() + n.slice(1) + (HUMAN_NEEDS[n] ? ` (${HUMAN_NEEDS[n]})` : "")).join("; ");

    if (mod === "leadership") {
      return `You are roleplaying as: ${drill.role} in a leadership skills drill.

Scene: ${drill.scene}
Objective for the user: ${drill.objective}
${userName ? `The person's name is ${userName}.` : ""}
${userRole ? `Their role: ${userRole}.` : ""}
${needsList ? `Human needs most at risk: ${needsList}.` : ""}
${NEEDS_PROMPT}
Stay in character. Keep responses concise and natural (2-4 sentences). React authentically to how they lead you. Do not refer to yourself as an AI.`;

Scene: ${drill.scene}
Objective for the user: ${drill.objective}

${NEEDS_PROMPT}

  async function submitAssessmentAnswer() {
    if (!assessmentAnswer.trim()) return;
    const newAnswers = [...assessmentAnswers, { q: STYLE_ASSESSMENT_QUESTIONS[assessmentStep].question, a: assessmentAnswer.trim() }];
    setAssessmentAnswers(newAnswers);
    setAssessmentAnswer("");

    if (assessmentStep < STYLE_ASSESSMENT_QUESTIONS.length - 1) {
      setAssessmentStep(s => s + 1);
    } else {
      // All questions answered, analyse
      setAssessmentLoading(true);
      setTimeout(() => {
        if (assessmentResultRef.current) assessmentResultRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 50);
      const answersText = newAnswers.map((item, i) => `Q${i+1}: ${item.q}\nAnswer: ${item.a}`).join("\n\n");
      try {
        const reply = await callAI(STYLE_MAP_PROMPT, [{ role:"user", content: answersText }]);
        const parsed = JSON.parse(reply.replace(/```json|```/g,"").trim());
        setAssessmentResult(parsed);
        // Auto-select the identified style for the drill, but keep the original default tracked separately
        const matched = LEADERSHIP_STYLES.find(ls => ls.label.toLowerCase() === parsed.defaultStyle?.toLowerCase());
        if (matched) {
          setSelectedStyle(matched.id);
          setDefaultStyleId(matched.id);
        }
      } catch { setAssessmentResult({ error: true }); }
      setAssessmentLoading(false);
    }
  }

    setAssessmentMode(false);
    startDiagnostic();

  async function startDiagnostic() {
    historyRef.current = [];
    setMessages([]);
    setInsights([]);

    setDebrief(null);
    setDrillPhase("diagnostic");

      setMessages([{ type:"ai", text:reply }]);

  async function sendMessage() {
    if (thinking || !input.trim()) return;
    const text = input.trim();
    setInput("");
    setMessages(m => [...m, { type:"user", text }]);
    historyRef.current = [...historyRef.current, { role:"user", content:text }];
    setThinking(true);
    const newCount = msgCount + 1;
    setMsgCount(newCount);

    if (drillPhase === "diagnostic") {
      // After first user response to diagnostic, go to teaching moment then drill
      const sysPrompt = buildDiagnosticSystemPrompt();
      if (newCount === 1) {
        try {
          const reply = await callAI(sysPrompt + "\n\nThe person has just responded to your diagnostic question. Acknowledge what you noticed in 1-2 sentences, then tell them you will now give them a brief teaching moment before the practice drill begins.", historyRef.current.slice(-6));
          historyRef.current = [...historyRef.current, { role:"assistant", content:reply }];
          setMessages(m => [...m, { type:"ai", text:reply }]);
          speakText(reply, true);
          setThinking(false);
          setTimeout(() => transitionToDrill(), 1800);
        } catch { setThinking(false); }
      } else {
        try {
          const reply = await callAI(sysPrompt, historyRef.current.slice(-8));
          historyRef.current = [...historyRef.current, { role:"assistant", content:reply }];
          setMessages(m => [...m, { type:"ai", text:reply }]);
          speakText(reply, true);
        } catch {}
        setThinking(false);
      }
      return;

    // Drill phase
    const drillSys = buildDrillSystemPrompt();
    try {
      const reply = await callAI(drillSys, historyRef.current.slice(-14));
      historyRef.current = [...historyRef.current, { role:"assistant", content:reply }];
      setMessages(m => [...m, { type:"ai", text:reply }]);
      speakText(reply);
      if (newCount % 2 === 0) runScoreAnalysis();
    } catch { setMessages(m => [...m, { type:"note", text:"Connection issue. Please try again." }]); }
    setThinking(false);
  }

    else if (mod === "executive") prompt = buildExecAnalysisPrompt(historyRef.current, userName, userContext, seniority);
    else if (mod === "thinking") {

      prompt = buildThinkingAnalysisPrompt(historyRef.current, fw?.label || "", fw?.teachingFocus || "", userName, userContext, seniority);

                      <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>{style.description?.slice(0,60)}...</div>
                    </button>
                  ))}
                </div>
              </>
            )}

            {/* STEP 2b: Assessment flow */}
            {commKnowsDefaultChoice === "no" && commAssessmentMode && !commAssessmentResult && !commAssessmentLoading && (
              <>
                <button style={s.backBtn} onClick={() => { setCommKnowsDefaultChoice(null); setCommAssessmentMode(false); }}>← Back</button>
                <div ref={assessmentQuestionRef} style={{ background:"rgba(212,168,83,0.06)", border:`1px solid rgba(212,168,83,0.18)`, borderRadius:10, padding:"20px 18px" }}>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:10 }}>
                    Question {commAssessmentStep + 1} of {COMM_ASSESSMENT_QUESTIONS.length}
                  </div>
                  <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"#EEF8F9", lineHeight:1.6, marginBottom:6, fontFamily:"'Cormorant Garamond', Georgia, serif", fontWeight:400 }}>
                    {COMM_ASSESSMENT_QUESTIONS[commAssessmentStep].question}
                  </div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(212,168,83,0.9)", marginBottom:14, fontStyle:"italic" }}>
                    {COMM_ASSESSMENT_QUESTIONS[commAssessmentStep].hint}
                  </div>
                  <textarea
                    style={{ ...s.fieldInput, minHeight:90, resize:"vertical", width:"100%", boxSizing:"border-box", marginBottom:12 }}
                    placeholder="Describe what you actually do..."
                    value={commAssessmentAnswer}
                    onChange={e => setCommAssessmentAnswer(e.target.value)}
                  />
                  <button
                    style={{ ...s.startBtn, opacity: commAssessmentAnswer.trim() ? 1 : 0.4 }}
                    disabled={!commAssessmentAnswer.trim()}
                    onClick={submitCommAssessmentAnswer}>
                    {commAssessmentStep < COMM_ASSESSMENT_QUESTIONS.length - 1 ? "Next Question" : "See My Style"}
                  </button>
                </div>
              </>
            )}

            {commKnowsDefaultChoice === "no" && commAssessmentLoading && (
              <div ref={assessmentResultRef} style={{ padding:"24px", background:"rgba(212,168,83,0.06)", border:`1px solid rgba(212,168,83,0.15)`, borderRadius:10, textAlign:"center" }}>
                <Dots />
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(212,168,83,0.9)", marginTop:10 }}>Analysing your responses...</div>
              </div>
            )}

            {commKnowsDefaultChoice === "no" && commAssessmentResult?.error && (
              <div style={{ padding:14, background:"rgba(192,83,106,0.08)", border:`1px solid rgba(192,83,106,0.2)`, borderRadius:8, fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.7)" }}>
                Could not analyse responses. <button style={{ background:"none", border:"none", color:TEAL, cursor:"pointer", textDecoration:"underline" }} onClick={() => setCommKnowsDefaultChoice("yes")}>Choose your style manually instead.</button>
              </div>
            )}

            {commKnowsDefaultChoice === "no" && commAssessmentResult && !commAssessmentResult.error && (
              <div ref={assessmentResultRef} style={{ background:"rgba(61,133,140,0.07)", border:`1px solid rgba(61,133,140,0.2)`, borderRadius:10, padding:"22px 20px" }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:12 }}>Your Default Style</div>
                <div style={{ display:"flex", alignItems:"baseline", gap:14, flexWrap:"wrap", marginBottom:14 }}>
                  <div style={{ fontSize:"clamp(20px, 3vw, 26px)", fontWeight:300, color:MIST, fontFamily:"'Cormorant Garamond', Georgia, serif" }}>{commAssessmentResult.defaultStyle}</div>
                  {commAssessmentResult.secondaryStyle && (
                    <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)" }}>+ <strong style={{ color:"rgba(232,244,245,0.85)" }}>{commAssessmentResult.secondaryStyle}</strong> as a secondary tendency</div>
                  )}
                </div>
                {commAssessmentResult.contextSplit && (
                  <div style={{ background:"rgba(212,168,83,0.08)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:8, padding:"12px 14px", marginBottom:16 }}>
                    <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.12em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:6 }}>Shifts by Context</div>
                    <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.8)", lineHeight:1.6 }}>{commAssessmentResult.contextSplit}</div>
                  </div>
                )}
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.8)", lineHeight:1.65, marginBottom:10 }}>{commAssessmentResult.rationale}</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.75)", lineHeight:1.65, marginBottom:6 }}><strong style={{ color:TEAL }}>What is working:</strong> {commAssessmentResult.strengths}</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(212,168,83,0.85)", lineHeight:1.65, marginBottom:20 }}><strong>Watch out for:</strong> {commAssessmentResult.watchOut}</div>
                <button style={s.startBtn} onClick={() => {
                  const matched = COMM_STYLES.find(cs => cs.label.toLowerCase() === commAssessmentResult.defaultStyle?.toLowerCase());
                  if (matched) setCommDefaultStyleId(matched.id);
                  setCommAssessmentMode(false);
                }}>
                  Continue
                </button>
              </div>
            )}

            {/* STEP 3: Default known. Offer only the three healthy styles to practise toward. */}
            {commDefaultStyleId && (
              <>
                <div style={{ marginBottom:14, padding:"12px 14px", background:"rgba(61,133,140,0.08)", border:`1px solid rgba(61,133,140,0.2)`, borderRadius:8, fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.75)", lineHeight:1.5, display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
                  <span>Your default is <strong style={{ color:MIST }}>{COMM_STYLES.find(cs=>cs.id===commDefaultStyleId)?.label}</strong>.</span>
                  <button style={{ background:"none", border:"none", color:TEAL, fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer", textDecoration:"underline", whiteSpace:"nowrap" }}
                    onClick={() => { setCommKnowsDefaultChoice(null); setCommDefaultStyleId(null); setSelectedStyle(null); setCommAssessmentMode(false); setCommAssessmentResult(null); }}>
                    Change
                  </button>
                </div>

                <label style={{ ...s.fieldLabel, marginBottom:6 }}>Which style would you like to build toward?</label>
                <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.78)", marginBottom:14, lineHeight:1.5 }}>
                  {COMM_STYLES.find(cs=>cs.id===commDefaultStyleId)?.healthy

                    : "These are the styles worth building toward. The drill will help you move from your default toward whichever you choose."}
                </div>
                <div style={s.styleGrid}>
                  {COMM_STYLES.filter(cs => cs.healthy).map(style => (
                    <button key={style.id}
                      style={{ ...s.styleBtn, ...(selectedStyle === style.id ? s.styleBtnActive : {}) }}
                      onClick={() => setSelectedStyle(style.id)}>
                      {style.id === commDefaultStyleId && (
                        <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.08em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:5 }}>Your default</div>
                      )}

                      <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>{style.description?.slice(0,60)}...</div>
                    </button>
                  ))}
                </div>
              </>
            )}
              </>
            )}
          </div>
        )}

        {activeModule?.id === "executive" && execMode === null && (
          <div style={{ marginBottom:28 }}>
            <label style={{ ...s.fieldLabel, marginBottom:14 }}>How would you like to build this?</label>
            <div style={s.styleGrid}>
              <button style={s.styleBtn} onClick={() => setExecMode("cards")}>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>Build the Vocabulary</div>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>Flip through word and phrase cards, trivial language on one side, boardroom equivalent on the other. Start here if this register is new to you.</div>
              </button>
              <button style={s.styleBtn} onClick={() => setExecMode("scenario")}>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>Practise a Scenario</div>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>Apply the register under pressure in a realistic boardroom or stakeholder conversation.</div>
              </button>
            </div>
          </div>
        )}

        {activeModule?.id === "executive" && execMode === "cards" && (
          <div style={{ marginBottom:28 }}>
            <button style={s.backBtn} onClick={() => { setExecMode(null); setVocabCategory(null); }}>← Back</button>
            {vocabCategory === null ? (
              <>
                <label style={{ ...s.fieldLabel, marginBottom:14 }}>Choose a category</label>
                <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                  {VOCAB_CATEGORIES.map(cat => {
                    const count = VOCAB_CARDS.filter(c => c.category === cat.id).length;
                    return (
                      <button key={cat.id} style={{ ...s.styleBtn, textAlign:"left" }}
                        onClick={() => { setVocabCategory(cat.id); setVocabIndex(0); setVocabFlipped(false); }}>

                marked={vocabMarked}

                completed={vocabCompleted}
                setCompleted={setVocabCompleted}
                onBack={() => setVocabCategory(null)}
                onDone={() => { setVocabCategory(null); setExecMode(null); }}
              />
            )}
          </div>
        )}

        {activeModule?.id === "executive" && execMode === "scenario" && (
          <div style={{ marginBottom:28 }}>
            <button style={s.backBtn} onClick={() => { setExecMode(null); setSelectedScenario(null); }}>← Back</button>
            <label style={{ ...s.fieldLabel, marginBottom:14 }}>Choose your drill</label>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {EXEC_SCENARIOS.map(sc => (
                <button key={sc.id}
                  style={{ ...s.styleBtn, ...(selectedScenario === sc.id ? s.styleBtnActive : {}), textAlign:"left" }}
                  onClick={() => setSelectedScenario(sc.id)}>
                  <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>{sc.label}</div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>{sc.objective.slice(0,80)}...</div>

                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:10 }}>What Strong Register Sounds Like</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.78)", lineHeight:1.6, marginBottom:10 }}>

                </div>
                <ExecReferenceExample scenarioId={selectedScenario} />
              </div>
            )}
          </div>
        )}

        {activeModule?.id === "thinking" && (
          <div style={{ marginBottom:28 }}>
            <label style={{ ...s.fieldLabel, marginBottom:6 }}>Choose a framework to practise</label>
            <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.75)", marginBottom:14, lineHeight:1.5 }}>
              Not sure which to pick? Choose the one that feels least natural to you. That is usually the most useful one to start with.
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {THINKING_FRAMEWORKS.map(fw => (
                <button key={fw.id}
                  style={{ ...s.styleBtn, ...(selectedFramework === fw.id ? s.styleBtnActive : {}), textAlign:"left" }}
                  onClick={() => setSelectedFramework(fw.id)}>
                  <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>{fw.label}</div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>{fw.description}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {!((activeModule?.id === "executive" && execMode === "cards") ||
           (activeModule?.id === "leadership" && leadershipMode === "vocab") ||
           (activeModule?.id === "communication" && commMode === "vocab") ||
           (activeModule?.id === "leadership" && leadershipMode === null) ||
           (activeModule?.id === "communication" && commMode === null)) && (
          <>
            <div style={{ marginBottom:22 }}>
              <label style={s.fieldLabel}>Your name</label>
              <input style={s.fieldInput} placeholder="First name" value={nameInputVal} onChange={e => { setNameInputVal(e.target.value); setUserName(e.target.value); }} />
            </div>
            <div style={{ marginBottom:22 }}>
              <label style={s.fieldLabel}>Your role and sector (optional)</label>
              <input style={s.fieldInput} placeholder="e.g. Head of Finance, professional services" value={userRole} onChange={e => setUserRole(e.target.value)} />
            </div>
            <div style={{ marginBottom:22 }}>
              <label style={{ ...s.fieldLabel, marginBottom:12 }}>Your level</label>
              <div style={s.styleGrid}>
                {SENIORITY_LEVELS.map(l => (
                  <button key={l.value} style={{ ...s.styleBtn, ...(seniority===l.value ? s.styleBtnActive : {}) }} onClick={() => setSeniority(l.value)}>
                    <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:3 }}>{l.label}</div>
                    <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)" }}>{l.note}</div>
                  </button>
                ))}
              </div>
            </div>
            <div style={{ marginBottom:28 }}>
              <label style={s.fieldLabel}>What do you want to work on?</label>
              <textarea style={{ ...s.fieldInput, minHeight:110, resize:"vertical", width:"100%", boxSizing:"border-box" }} placeholder="e.g. I hedge too much when I speak to senior stakeholders. I want to sound more decisive." value={userContext} onChange={e => setUserContext(e.target.value)} />
            </div>

            <div style={{ marginBottom:28 }}>
              <label style={{ ...s.fieldLabel, marginBottom:12 }}>Who are you speaking to?</label>
              <div style={s.styleGrid}>
                <button
                  style={{ ...s.styleBtn, ...(characterGender==="female" ? s.styleBtnActive : {}) }}
                  onClick={() => setCharacterGender("female")}>
                  <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>Female voice</div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>Grace plays the other person</div>
                </button>
                <button
                  style={{ ...s.styleBtn, ...(characterGender==="male" ? s.styleBtnActive : {}) }}
                  onClick={() => setCharacterGender("male")}>
                  <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:4 }}>Male voice</div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)", lineHeight:1.4 }}>Eddie plays the other person</div>
                </button>
              </div>
            </div>

            <button
              style={{ ...s.startBtn, opacity:(
                activeModule?.id === "executive" ? !!selectedScenario :
                activeModule?.id === "thinking" ? !!selectedFramework :
                !!selectedStyle
              ) ? 1 : 0.45 }}
              disabled={
                activeModule?.id === "executive" ? !selectedScenario :
                activeModule?.id === "thinking" ? !selectedFramework :
                !selectedStyle
              }
              onClick={startDiagnostic}>
              Start the Diagnostic
            </button>
          </>
        )}
      </div>
    </div>
  );

  // ── DRILL ──
  if (view === "drill") {
    const drillPhaseLabel = drillPhase === "diagnostic" ? "Diagnostic" : "Practice Drill";
    return (
      <div style={s.drillLayout} className="skills-root-mobile">
        <style>{`
        @media (max-width: 700px) {
          .skills-panel { position: fixed !important; right: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(${panelOpen ? "0" : "100%"}) !important; box-shadow: -4px 0 24px rgba(0,0,0,0.4); }
          .skills-panel-toggle { display: flex !important; }
          .skills-border { border-right: none !important; }
          .skills-desktop-actions { display: none !important; }
          .skills-mobile-trigger { display: flex !important; }
          .skills-stage-clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
          .skills-root-mobile { height: auto !important; overflow: visible !important; display: block !important; }
          .skills-main-mobile { height: auto !important; min-height: 100vh !important; overflow: visible !important; }
          .skills-topbar-mobile { position: sticky !important; top: 0; z-index: 30; background: ${DARKER}; }
          .skills-conv-mobile { overflow-y: visible !important; flex: none !important; }
          .skills-input-mobile { position: sticky !important; bottom: 0; z-index: 25; background: ${DARKER}; }
          .skills-mobile-end-debrief { display: flex !important; position: sticky !important; bottom: 0; z-index: 24; }
        }
        @media (min-width: 701px) {
          .skills-panel-toggle { display: none !important; }
          .skills-mobile-trigger { display: none !important; }
        }
      `}</style>
      <div style={s.drillMain} className="skills-border skills-main-mobile">
          <div style={s.topbar} className="skills-topbar-mobile">
            <div style={{ minWidth:0, flex:1 }}>
              <div style={s.labEyebrow}>Rewire Skills Lab &nbsp;|&nbsp; {activeModule?.title}</div>
              <div style={{ ...s.labTitle, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{getCurrentStyleLabel() || activeModule?.title} &nbsp; <span style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:AMBER, fontStyle:"italic" }}>{drillPhaseLabel}</span></div>
            </div>
            <div className="skills-desktop-actions" style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              <button className="skills-panel-toggle" style={{ ...s.labBtn, display:"none" }} onClick={() => setPanelOpen(p => !p)}>
                {panelOpen ? "✕ Close" : "📊 Scores"}
              </button>
              <button style={{ ...s.labBtn, borderColor:AMBER, color:AMBER }} onClick={triggerDebrief}>End and debrief</button>
              <button style={s.labBtn} onClick={resetToSetup}>Restart</button>
              <button style={s.labBtn} onClick={() => setView("lobby")}>Exit</button>
            </div>
            <button
              className="skills-mobile-trigger"
              style={{ display:"none", width:36, height:36, borderRadius:8, border:`1px solid rgba(61,133,140,0.3)`, background:"transparent", color:"rgba(232,244,245,0.8)", fontSize:"clamp(14px, 2.2vw, 18px)", cursor:"pointer", flexShrink:0, alignItems:"center", justifyContent:"center" }}
              onClick={() => setMenuOpen(m => !m)}>
              ⋮
            </button>
          </div>

          {menuOpen && (
            <div style={{ position:"absolute", top:64, right:16, zIndex:60, background:DARK, border:`1px solid rgba(61,133,140,0.25)`, borderRadius:10, padding:8, display:"flex", flexDirection:"column", gap:4, minWidth:170, boxShadow:"0 8px 24px rgba(0,0,0,0.4)" }}>
              <button style={{ ...s.labBtn, textAlign:"left", border:"none" }} onClick={() => { setPanelOpen(true); setMenuOpen(false); }}>📊 Scores</button>
              <button style={{ ...s.labBtn, textAlign:"left", border:"none", color:AMBER }} onClick={() => { triggerDebrief(); setMenuOpen(false); }}>End and debrief</button>
              <button style={{ ...s.labBtn, textAlign:"left", border:"none" }} onClick={() => { resetToSetup(); setMenuOpen(false); }}>Restart</button>
              <button style={{ ...s.labBtn, textAlign:"left", border:"none" }} onClick={() => setView("lobby")}>Exit</button>
            </div>
          )}

          {drillInfo && drillPhase === "drill" && (
            <div style={s.stageBar}>
              <span style={{ fontSize:"clamp(14px, 2.2vw, 18px)", marginRight:8 }}>🎯</span>
              <span style={s.stageText} className="skills-stage-clamped">{drillInfo.objective}</span>
            </div>
          )}
          <div ref={convRef} style={s.convArea} className="skills-conv-mobile">
            {messages.map((m, i) => (
              m.type === "note" ? (
                <div key={i} style={s.bubbleNote}>{m.text}</div>
              ) : m.type === "user" ? (
                <div key={i} style={s.msgUser}>
                  <div style={s.msgRole}>{userName || "You"}</div>
                  <div style={s.bubbleUser}>{m.text}</div>
                </div>
              ) : (
                <div key={i} style={s.msgAi}>
                  <div style={s.msgRole}>Coach</div>
                  <div style={s.bubbleAi}>{m.text}</div>
                </div>
              )
            ))}
            {thinking && (
              <div style={s.msgAi}>
                <div style={s.msgRole}>Coach</div>
                <div style={s.bubbleAi}><Dots /></div>
              </div>
            )}
          </div>
          <div className="skills-mobile-end-debrief" style={{ display:"none", gap:8, margin:"0 20px 10px" }}>
            <button
              style={{ flex:1, padding:"12px", background:"rgba(212,168,83,0.12)", border:`1px solid ${AMBER}`, borderRadius:10, color:AMBER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", fontWeight:600, cursor:"pointer", letterSpacing:"0.03em" }}
              onClick={triggerDebrief}>
              End and Debrief
            </button>
            <button
              style={{ padding:"12px 16px", background:"transparent", border:`1px solid rgba(61,133,140,0.3)`, borderRadius:10, color:"rgba(232,244,245,0.8)", fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", fontWeight:600, cursor:"pointer" }}
              onClick={resetToSetup}>
              ↺ Restart
            </button>
          </div>
          <div style={s.inputArea} className="skills-input-mobile">
            <div style={s.inputRow}>
              <textarea

              />
              <button
                style={{ ...s.sendBtn, background: isListening ? "#c0536a" : isSpeaking ? AMBER : TEAL }}
                onClick={isListening ? () => { stopListening(); setTimeout(sendMessage, 300); } : sendMessage}
                disabled={thinking}>
                {isListening ? "⏹" : "↑"}
              </button>
            </div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:8 }}>
              <div style={s.inputHint}><span>Enter to send</span><span>Shift+Enter for new line</span></div>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                {isSpeaking && <button onClick={stopSpeaking} style={{ background:"none", border:"none", color:AMBER, fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer", padding:"2px 6px" }}>⏹ Stop</button>}
                <button onClick={isListening ? stopListening : startListening}
                  style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${isListening?"#c0536a":"rgba(61,133,140,0.3)"}`, background: isListening?"rgba(192,83,106,0.15)":"transparent", color: isListening?"#c0536a":"rgba(232,244,245,0.7)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}>
                  {isListening ? "🔴 Listening..." : "🎤 Speak"}
                </button>
                <button onClick={() => setVoiceEnabled(v=>!v)}
                  style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${voiceEnabled?TEAL:"rgba(61,133,140,0.3)"}`, background: voiceEnabled?"rgba(61,133,140,0.15)":"transparent", color: voiceEnabled?MIST:"rgba(232,244,245,0.75)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}>
                  {voiceEnabled ? "🔊 Voice on" : "🔇 Voice off"}
                </button>
              </div>
            </div>
          </div>
        </div>

        <div style={s.panel} className="skills-panel">
          <div style={s.panelSection}>
            <div style={s.panelTitle}>Skills Score</div>
            {scoreKeys.map(k => (
              <div key={k} style={{ marginBottom:12 }}>
                <div style={s.metricRow}>
                  <span style={s.metricName}>{scoreLabels[k] || k}</span>
                  <span style={s.metricScore}>{scores[k] ?? "-"}</span>
                </div>
                <div style={s.barTrack}>
                  <div style={{ height:"100%", borderRadius:2, background:TEAL, width:`${scores[k]||0}%`, transition:"width 0.6s ease" }} />
                </div>
              </div>
            ))}
            <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.85)", lineHeight:1.5, marginTop:4 }}>Scores update every two exchanges. Calibrated and honest.</div>
          </div>
          <div style={s.panelSection}>
            <div style={s.panelTitle}>Live Insights</div>
            {insights.length === 0
              ? <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.7)", fontStyle:"italic" }}>Insights appear as you work through the drill.</div>
              : insights.map((n,i) => <div key={i} style={s.insightNote}>{n}</div>)}
          </div>
          {activeModule?.id === "leadership" && selectedStyle && (
            <div style={s.panelSection}>
              <div style={s.panelTitle}>Style Notes</div>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.7)", lineHeight:1.6 }}>
                {LEADERSHIP_STYLES.find(ls=>ls.id===selectedStyle)?.when}
              </div>
            </div>
          )}
          {activeModule?.id === "communication" && selectedStyle && (
            <div style={s.panelSection}>
              <div style={s.panelTitle}>Style Notes</div>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.7)", lineHeight:1.6 }}>
                {COMM_STYLES.find(cs=>cs.id===selectedStyle)?.description}
              </div>
            </div>
          )}
          {activeModule?.id === "thinking" && selectedFramework && (
            <div style={s.panelSection}>
              <div style={s.panelTitle}>Framework Notes</div>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.7)", lineHeight:1.6 }}>
                {THINKING_FRAMEWORKS.find(tf=>tf.id===selectedFramework)?.description}
              </div>
            </div>
          )}
          <div style={s.panelSection}>
            <div style={s.panelTitle}>Voice Settings</div>
            <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.78)", marginBottom:10, lineHeight:1.5 }}>
              {voiceEnabled && !elevenLabsKey && !PROXY_BASE_URL ? "Using browser voice. Character voices need an ElevenLabs connection." : voiceEnabled ? "Character voice active." : "Voice output is off."}
            </div>
            {voiceEnabled && (
              <>
                <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.1em", textTransform:"uppercase", color:"rgba(232,244,245,0.75)", marginBottom:8 }}>Who are you speaking to?</div>
                <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                  <button
                    style={{ flex:1, padding:"8px", borderRadius:6, border:`1px solid ${characterGender==="female"?TEAL:"rgba(61,133,140,0.25)"}`, background: characterGender==="female"?"rgba(61,133,140,0.15)":"transparent", color: characterGender==="female"?MIST:"rgba(232,244,245,0.82)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}
                    onClick={() => setCharacterGender("female")}>
                    Female voice
                  </button>
                  <button
                    style={{ flex:1, padding:"8px", borderRadius:6, border:`1px solid ${characterGender==="male"?TEAL:"rgba(61,133,140,0.25)"}`, background: characterGender==="male"?"rgba(61,133,140,0.15)":"transparent", color: characterGender==="male"?MIST:"rgba(232,244,245,0.82)", fontSize:"clamp(13px, 2.1vw, 17px)", cursor:"pointer" }}
                    onClick={() => setCharacterGender("male")}>
                    Male voice
                  </button>
                </div>
                {!PROXY_BASE_URL && (
                  <input style={{ ...s.fieldInput, fontSize:"clamp(13px, 2.1vw, 17px)", padding:"8px 12px" }}
                    placeholder="ElevenLabs API key (optional)"
                    type="password"
                    value={elevenLabsKey}
                    onChange={e => setElevenLabsKey(e.target.value)} />
                )}
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ── DEBRIEF ──
  if (view === "debrief") return (
    <div style={s.app}>
      <div style={s.debrief}>
        {debriefLoading ? (
          <div style={{ textAlign:"center", padding:"80px 0" }}>
            <Dots />
            <div style={{ color:"rgba(232,244,245,0.75)", fontSize:"clamp(13px, 2.1vw, 17px)", marginTop:16 }}>Preparing your debrief...</div>
          </div>
        ) : debrief?.error ? (
          <div style={{ textAlign:"center", padding:"80px 0", color:"rgba(232,244,245,0.75)" }}>
            Could not generate debrief.
            <button style={{ ...s.debriefBtnSecondary, marginLeft:12 }} onClick={() => setView("drill")}>Return to Drill</button>
          </div>
        ) : debrief ? (
          <>
            <div style={{ marginBottom:36, paddingBottom:28, borderBottom:`1px solid rgba(61,133,140,0.15)` }}>
              <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.2em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:12 }}>Skills Lab Debrief</div>
              <div style={s.debriefH1}>{debrief.headline}</div>
              <div style={s.debriefSub}>{debrief.styleName || activeModule?.title} &nbsp;|&nbsp; {new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}{userName ? ` | ${userName}` : ""}</div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Overall Performance</div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.overall}</div></div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Scores</div>
              <div style={s.debriefScoreGrid}>
                {scoreKeys.map(k => (
                  <div key={k} style={s.scoreCard}>
                    <div style={s.scoreName}>{scoreLabels[k] || k}</div>
                    <div style={s.scoreVal}>{debrief.scores?.[k] ?? "-"}</div>
                    <div style={s.barTrack}><div style={{ height:"100%", borderRadius:2, background:TEAL, width:`${debrief.scores?.[k]||0}%` }} /></div>
                  </div>
                ))}
              </div>
            </div>

            {(debrief.detectedStyle || debrief.defaultStyle) && (
              <div style={{ marginBottom:28 }}>
                <div style={s.debriefSectionTitle}>{activeModule?.id === "leadership" ? "Default Style Observed" : "Communication Style Observed"}</div>
                <div style={s.debriefCard}>
                  <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.12em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:8 }}>{debrief.detectedStyle || debrief.defaultStyle}</div>
                  <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.styleNotes}</div>
                </div>
              </div>
            )}

            {debrief.beforeAfter && (
              <div style={{ marginBottom:28 }}>
                <div style={s.debriefSectionTitle}>Register Reframe</div>
                <div style={s.beforeAfter}>
                  <div style={s.beforeCard}>
                    <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.12em", textTransform:"uppercase", color:"rgba(192,83,106,0.8)", fontWeight:600, marginBottom:8 }}>Current Register</div>
                    <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.85)", fontStyle:"italic", lineHeight:1.6 }}>"{debrief.beforeAfter.before}"</div>
                  </div>
                  <div style={s.afterCard}>
                    <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", letterSpacing:"0.12em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:8 }}>Boardroom Register</div>
                    <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.85)", lineHeight:1.6 }}>{debrief.beforeAfter.after}</div>
                  </div>
                </div>
              </div>
            )}

            {debrief.hedgingExamples?.length > 0 && (
              <div style={{ marginBottom:28 }}>
                <div style={s.debriefSectionTitle}>Language to Replace</div>
                <div style={s.debriefCard}>
                  <ul style={{ paddingLeft:18, listStyle:"disc" }}>
                    {debrief.hedgingExamples.map((h,i) => <li key={i} style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.7)", lineHeight:1.65, marginBottom:6, fontStyle:"italic" }}>"{h}"</li>)}
                  </ul>
                </div>
              </div>
            )}

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>What You Did Well</div>
              <div style={s.debriefCard}>
                <ul style={{ paddingLeft:18, listStyle:"disc" }}>
                  {(debrief.strengths||[]).map((st,i) => <li key={i} style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.65, marginBottom:6 }}>{st}</li>)}
                </ul>
              </div>
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={s.debriefSectionTitle}>Primary Development Area</div>
              <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.developmentArea}</div></div>
            </div>

            {debrief.needsMostActive && (
              <div style={{ marginBottom:28 }}>
                <div style={s.debriefSectionTitle}>Human Needs in the Scene</div>
                <div style={s.needsGrid}>
                  {Object.entries(HUMAN_NEEDS).map(([key]) => {
                    const active = (debrief.needsMostActive||[]).map(n=>n.toLowerCase()).includes(key);
                    return (
                      <div key={key} style={{ ...s.needChip, ...(active ? s.needChipActive : {}) }}>
                        <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", fontWeight:500, color: active ? MIST : "rgba(232,244,245,0.75)", marginBottom:3 }}>{key.charAt(0).toUpperCase()+key.slice(1)}</div>
                        {active && <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:TEAL }}>Active in scene</div>}
                      </div>
                    );
                  })}
                </div>
                {debrief.needsAnalysis && <div style={s.debriefCard}><div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7 }}>{debrief.needsAnalysis}</div></div>}
              </div>
            )}

            <div style={s.takeaway}>
              <div style={s.takeawayLabel}>Take This Forward</div>
              <div style={s.takeawayText}>{debrief.takeaway}</div>
            </div>

            <div style={{ marginBottom:32, background:"rgba(61,133,140,0.07)", border:`1px solid rgba(61,133,140,0.2)`, borderRadius:12, padding:"22px 20px" }}>
              <div style={s.debriefSectionTitle}>Next Drill</div>
              <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.85)", lineHeight:1.7, marginBottom:20 }}>{debrief.nextDrill}</div>
              <button
                style={{ width:"100%", padding:"13px", background:TEAL, border:"none", borderRadius:8, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(13px, 2vw, 16px)", fontWeight:700, cursor:"pointer", letterSpacing:"0.03em" }}
                onClick={() => {
                  resetToSetup();
                }}>
                Go Again →
              </button>
            </div>

            {debrief.registerNote && (
              <div style={{ marginBottom:28, padding:"16px 20px", background:"rgba(212,168,83,0.07)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:10 }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:8 }}>Register Note</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(212,168,83,0.9)", lineHeight:1.65 }}>{debrief.registerNote}</div>
              </div>
            )}

            {debrief.blindSpot && (
              <div style={{ marginBottom:28, padding:"16px 20px", background:"rgba(212,168,83,0.07)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:10 }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:8 }}>What the Framework Surfaced</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(212,168,83,0.9)", lineHeight:1.65 }}>{debrief.blindSpot}</div>
              </div>
            )}

            <div style={{ marginBottom:32, padding:"18px 20px", background:"rgba(61,133,140,0.06)", border:`1px solid rgba(61,133,140,0.15)`, borderRadius:10 }}>
              <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:8 }}>Test This Under Pressure</div>
              <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.7)", lineHeight:1.65 }}>Ready to take what you have built into a real-world scenario? The Rewire Conversation Lab puts these skills under pressure with live roleplay, dynamic resistance and performance intelligence in real time.</div>
            </div>

            <div style={s.debriefActions}>
              <button style={s.debriefBtnPrimary} onClick={resetToSetup}>Practise Again</button>
              <button style={s.debriefBtnSecondary} onClick={() => exportDebriefPDF(debrief)}>Download PDF Debrief</button>
              <button style={s.debriefBtnSecondary} onClick={() => setView("lobby")}>Choose New Module</button>
            </div>
          </>
        ) : null}
      </div>
    </div>
  );

  return null;
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>
