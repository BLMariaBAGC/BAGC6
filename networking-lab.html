const SCENARIOS = [
  { id:"prep-intro", category:"before", title:"Preparing Your Introduction", desc:"Sharpen a natural 30-second introduction that opens conversation rather than closing it.", skills:["Clarity","Confidence"], role:"Networking Mentor", scene:"You have a networking event tomorrow. A trusted mentor has offered twenty minutes to help you sharpen your introduction. They will ask you to deliver it, then push: too long, too vague, too much job title, not enough hook. The goal is an introduction that invites a question back, not a rehearsed speech.", needsFocus:"certainty,significance" },
  { id:"prep-objectives", category:"before", title:"Setting Your Objectives", desc:"Define what success actually looks like before you walk in, so the event has a purpose.", skills:["Clarity","Flow"], role:"Networking Mentor", scene:"Tomorrow evening is a business networking event. Your mentor asks the question most people never answer: what do you actually want from it? Vague answers like wanting to meet people will be challenged. By the end you should have two or three concrete, realistic objectives you can act on in the room.", needsFocus:"certainty,growth" },
  { id:"prep-nerves", category:"before", title:"Managing Pre-Event Nerves", desc:"Turn the anxiety before an event into a plan you can walk in with.", skills:["Confidence","Flow"], role:"Experienced Networker", scene:"The event starts in an hour and the familiar dread is building: walking in alone, not knowing anyone, the fear of standing by the wall. An experienced networker you trust has ten minutes for you. Talk it through honestly and build a simple arrival plan: first five minutes, first conversation, one realistic goal.", needsFocus:"certainty,significance,connection" },
  { id:"arrival-registration", category:"arrival", title:"Registration and First Impressions", desc:"Handle the welcome desk with warmth, and use the host as your first ally in the room.", skills:["Rapport","Confidence"], role:"Event Host", scene:"You arrive at the venue. The event host is at the registration desk with name badges. This is the easiest conversation of the night, and most people waste it. Hosts know everyone in the room. Handle the welcome naturally and see whether you can leave the desk with a name, a direction, or even an introduction.", needsFocus:"connection,certainty" },
  { id:"arrival-busy-room", category:"arrival", title:"Walking into a Busy Room", desc:"Enter a room already full of conversation and find your first foothold.", skills:["Confidence","Rapport"], role:"Fellow Attendee", scene:"You walk in and the room is already loud: clusters of people mid-conversation, laughter, nobody looking at the door. Near the refreshments, another attendee is standing alone with a coffee, scanning the room just like you. This is your foothold. Approach and open.", needsFocus:"connection,significance,certainty" },
  { id:"arrival-approached", category:"arrival", title:"When Someone Approaches You", desc:"Convert the moment someone walks up to you while you are standing alone.", skills:["Rapport","Listening"], role:"Approaching Attendee", scene:"You are standing alone with a drink, gathering yourself before your first approach, when someone walks up to you and opens with a friendly line. The pressure of approaching is gone, but now you have to hold and build the conversation. Make them glad they picked you.", needsFocus:"connection,significance" },
  { id:"read-room", category:"arrival", title:"Reading the Room", desc:"Learn to see what the room is telling you: who is open, who is busy, where to go first.", skills:["Listening","Confidence"], role:"Experienced Networking Companion", scene:"You have just walked in with an experienced networker who is generous with their craft. Before either of you approaches anyone, they turn it into a quiet masterclass: they will describe what is happening around the room, closed pairs, open triangles, the person checking their phone alone, the group mid-laughter, and ask you to read it. Who looks approachable? Who is busy? Where would you go first, and why? Your reads will be gently tested and sharpened before you commit to an approach.", needsFocus:"certainty,growth" },
  { id:"start-icebreak", category:"starting", title:"Breaking the Ice", desc:"Open a conversation with a stranger using the room itself, not a rehearsed line.", skills:["Rapport","Flow"], role:"Attendee in the Queue", scene:"You are in the coffee queue next to someone you have never met. You have roughly ninety seconds of natural proximity before you both walk away with your cups. The event, the venue, the speaker, the queue itself: everything around you is material. Open naturally and see if the conversation earns a continuation.", needsFocus:"connection,variety" },
  { id:"start-intro", category:"starting", title:"Introducing Yourself Without a Script", desc:"Answer the inevitable question without reciting a job title, in a way that invites curiosity.", skills:["Clarity","Confidence"], role:"Curious Attendee", scene:"A friendly attendee has just asked the question you knew was coming: so, what do you do? The trap is the job-title recital that ends conversations. The skill is an answer that describes the problem you solve or the change you create, short enough to breathe, interesting enough that they ask the next question.", needsFocus:"significance,connection" },
  { id:"intro-10s", category:"starting", title:"The 10-Second Answer", desc:"Answer 'what do you do?' in one breath, engineered purely to earn the next question.", skills:["Clarity","Confidence"], role:"Attendee Who Just Asked", scene:"Mid-conversation, the question lands: so, what do you do? You have roughly ten seconds before their attention decides. The objective is not to explain everything; it is curiosity. One or two sentences that make them lean in and ask more. The attendee will react honestly: if the answer is a job-title recital, their interest will visibly fade; if it hooks, they will dig.", needsFocus:"significance,connection" },
  { id:"intro-30s", category:"starting", title:"The 30-Second Elevator Pitch", desc:"The classic networking introduction: who you are, who you help, and the result you create, in half a minute.", skills:["Clarity","Confidence"], role:"Attendee Who Asked About You", scene:"The conversation has opened and it is your moment: roughly thirty seconds of genuine attention to land who you are, who you help, and the change you create. Long enough for substance, short enough that every sentence must earn its place. The attendee is listening honestly: they will ask a follow-up if it lands, glaze politely if it becomes a speech, and interrupt if it runs long. Rehearsed-sounding delivery will be gently called out; this should sound like you, not a script.", needsFocus:"significance,certainty" },
  { id:"intro-60s", category:"starting", title:"The 60-Second Introduction", desc:"Deliver the structured round-the-table introduction used at formal networking meetings.", skills:["Clarity","Flow"], role:"Meeting Facilitator", scene:"You are at a structured networking meeting and it is nearly your turn: sixty seconds, standing, everyone listening. Who you are, who you help, what result you create, and what a good referral looks like for you. The facilitator keeps time and will follow up with a question the room would be thinking. Rambling loses the room; structure with warmth wins it.", needsFocus:"significance,certainty,contribution" },
  { id:"start-beyond-smalltalk", category:"starting", title:"Moving Beyond Small Talk", desc:"Turn pleasant weather-and-traffic chat into a conversation of actual substance.", skills:["Questions","Listening"], role:"Polite Attendee", scene:"You have been exchanging pleasantries with an attendee for a few minutes: the venue, the turnout, the journey in. It is pleasant and it is going nowhere. The skill is the pivot: a genuine question that invites them to talk about something they care about, without the gear change feeling abrupt.", needsFocus:"connection,growth" },
  { id:"start-common-ground", category:"starting", title:"Finding Common Ground", desc:"Build a bridge with someone whose industry and world seem nothing like yours.", skills:["Questions","Rapport"], role:"Attendee from a Different Industry", scene:"You are talking with someone from a completely different sector: different industry, different customers, different world. The lazy move is to let the conversation die politely. The skill is finding the shared layer underneath: common challenges, common patterns, common people. Dig for it with genuine curiosity.", needsFocus:"connection,variety,growth" },
  { id:"join-two", category:"joining", title:"Joining Two People Mid-Conversation", desc:"Approach two people already talking and earn your place in the exchange.", skills:["Confidence","Listening"], role:"One of Two Attendees", scene:"Two people are talking near the window. Their body language is open: angled outward, relaxed, not intimate. That is the signal a pair can be joined. Approach, wait for the natural beat, and enter without hijacking. You will be speaking with one of them; the other has just stepped away to take a call as you arrive.", needsFocus:"connection,significance,certainty" },
  { id:"join-group", category:"joining", title:"Joining a Larger Group", desc:"Enter a group of four or five without interrupting, and become part of it rather than an audience.", skills:["Listening","Flow"], role:"Group Member", scene:"A group of five is mid-conversation and one of them catches your eye and half-steps aside: the invitation. You are now standing in the circle. The mistake is to either say nothing for five minutes or to seize the floor. Listen, find the thread, and contribute at the right moment. The group member next to you turns to include you.", needsFocus:"connection,significance" },
  { id:"join-invited", category:"joining", title:"Being Brought into a Conversation", desc:"Handle the moment someone introduces you into their conversation with a third person.", skills:["Rapport","Clarity"], role:"The Person You Are Introduced To", scene:"Someone you met earlier tonight takes you warmly by the arm: there is someone you have to meet. Suddenly you are being introduced to their contact with a generous but slightly inaccurate description of what you do. Correct course gracefully, honour the introducer, and build the new connection on your own terms.", needsFocus:"significance,connection" },
  { id:"biz-explain", category:"business", title:"Explaining What You Do", desc:"Describe your work so a stranger understands it, remembers it, and can repeat it to someone else.", skills:["Clarity","Confidence"], role:"Interested Attendee", scene:"An attendee is genuinely interested in what you do and keeps asking questions. This is the good problem: real curiosity, real attention. The test is whether you can explain your work in plain language, with a concrete example, so clearly that they could describe you accurately to a colleague on Monday. Jargon loses them; stories keep them.", needsFocus:"significance,contribution" },
  { id:"biz-services", category:"business", title:"Talking About Your Services Without Selling", desc:"Discuss what you offer with a potential client in the room, without turning the conversation into a pitch.", skills:["Rapport","Clarity"], role:"Potential Client", scene:"The person you are speaking with fits your ideal client profile almost exactly, and they have just asked about your services. Every instinct says pitch. The room says do not. The skill is to be genuinely useful and interesting about what you do, plant the seed, and move toward a follow-up rather than a close. Networking events reward the second conversation, not the first.", needsFocus:"significance,certainty,contribution" },
  { id:"biz-speaker", category:"business", title:"Approaching the Speaker After Their Talk", desc:"Get more than a handshake from the person everyone else is also queuing to meet.", skills:["Questions","Confidence"], role:"Event Speaker", scene:"The keynote has just finished and the speaker is surrounded by a loose queue of people offering the same compliment. You have perhaps ninety seconds when your turn comes. Generic praise gets a generic smile. A specific, thoughtful response to something they actually said gets remembered. Make your moment count and leave with a reason to follow up.", needsFocus:"significance,growth" },
  { id:"biz-senior", category:"business", title:"Sixty Seconds with Someone Very Senior", desc:"Hold a brief, memorable exchange with the most senior person in the room without shrinking or performing.", skills:["Confidence","Clarity"], role:"Managing Director", scene:"You find yourself next to the managing director of a company you would love to work with. They are polite, guarded, and clearly used to being pitched at events. You have about a minute of natural conversation available. The goal is not to sell or impress: it is to be a person worth remembering, and perhaps earn permission to follow up.", needsFocus:"significance,certainty" },
  { id:"intro-2min", category:"business", title:"The Two-Minute Business Conversation", desc:"Hold a natural business conversation where the other person interrupts, questions, and challenges as real people do.", skills:["Flow","Confidence"], role:"Engaged Attendee", scene:"This is not a pitch; it is a conversation. The attendee is genuinely engaged but conversational: they will interrupt with questions, change direction, challenge assumptions, and follow tangents, exactly as real networking conversations behave. The skill is holding your thread without a script: responsive, natural, and still landing the substance of what you do.", needsFocus:"significance,connection,variety" },
  { id:"biz-product", category:"business", title:"Explaining One Product or Service", desc:"Present a single offer, a programme, workshop, or service, and survive the four questions everyone asks.", skills:["Clarity","Questions"], role:"Evaluating Attendee", scene:"The conversation has narrowed to one specific thing you offer: a programme, a workshop, a service, a membership. The attendee is interested but rigorous, and the four questions are coming: how is it different, who is it for, why you, and what results do people actually achieve? Vague answers will be politely probed. Specifics, examples, and outcomes are what land.", needsFocus:"significance,certainty,contribution" },
  { id:"biz-already", category:"business", title:"We Already Work with Someone", desc:"Respond to the most common brush-off in networking without arguing or folding.", skills:["Rapport","Confidence"], role:"Attendee with an Existing Provider", scene:"You have just explained what you do and the reply arrives: we already work with someone for that. It is not hostile, it is a door closing politely. Arguing loses; agreeing and vanishing wastes the contact. The skill is the graceful third path: respect the incumbent, stay interesting, position yourself for the day the relationship changes, and keep the human connection alive.", needsFocus:"significance,certainty,connection" },
  { id:"biz-interested", category:"business", title:"When Someone Becomes Interested", desc:"Convert genuine interest into a concrete next step: information, a meeting, or an introduction.", skills:["Flow","Clarity"], role:"Interested Prospect", scene:"It is happening: the person you are speaking with is genuinely interested. They may ask you to send information, suggest a meeting, or offer to introduce you to a colleague. Each of those forks needs handling: 'send me some information' can be a polite exit or a real opening, and the difference is how you respond. Secure something concrete with a date or a named next step before the room swallows you both.", needsFocus:"significance,certainty,contribution" },
  { id:"biz-connector", category:"business", title:"Making an Introduction", desc:"Introduce two of your contacts to each other so well that both remember you as the connector.", skills:["Rapport","Clarity"], role:"Contact You Are Introducing", scene:"You are talking with a contact when you spot another of your contacts across the room, and you realise these two genuinely should know each other. Being the connector is one of the strongest positions in networking: people remember who introduced them. As the second person approaches, practise the introduction that makes both of them look good: who each person is, why they should talk, and the thread that starts their conversation, before you gracefully step back.", needsFocus:"contribution,connection,significance" },
  { id:"biz-referral", category:"business", title:"Asking for an Introduction", desc:"Ask a well-connected contact to introduce you to someone specific, without making it awkward.", skills:["Clarity","Rapport"], role:"Well-Connected Attendee", scene:"You are talking with someone who clearly knows everyone in the room, and they know the person you most want to meet. Asking for an introduction feels grabby; not asking wastes the conversation. The skill is to make the ask specific, easy to grant, and framed around mutual value, so they can say yes in one sentence.", needsFocus:"connection,significance,contribution" },
  { id:"diff-dominator", category:"difficult", title:"The Conversation Dominator", desc:"Reclaim space in a conversation with someone who talks over everything, without rudeness.", skills:["Confidence","Flow"], role:"Attendee Who Monopolises", scene:"You are trapped in a conversation with someone who has been talking about themselves for eight minutes: their business, their opinions, their diary. You have said perhaps four words. The exit alone is a skill; better still is redirecting the exchange into an actual dialogue, and then choosing whether it deserves more of your evening.", needsFocus:"significance,certainty" },
  { id:"diff-seller", category:"difficult", title:"The Person Who Only Wants to Sell", desc:"Handle the attendee who treats you as a prospect from the first sentence.", skills:["Confidence","Rapport"], role:"Pushy Salesperson", scene:"Within a minute of meeting, this attendee has qualified your budget, name-dropped their clients, and reached for a brochure. You do not want their service, but you also do not want to be rude: this room talks. The skill is a boundary with grace: decline the pitch, keep the person, exit clean.", needsFocus:"certainty,connection" },
  { id:"diff-different", category:"difficult", title:"What Makes You Different?", desc:"Handle the challenge every business gets: lots of companies do what you do, and your prices look high.", skills:["Confidence","Clarity"], role:"Challenging Attendee", scene:"The attendee is direct: there are lots of companies like yours, what makes you different? And when you answer, the follow-up is ready: that sounds expensive. This is not rudeness; it is the room testing whether you believe your own story. Defensiveness fails, discounting fails, and rehearsed slogans fail. Grounded specifics, calm conviction, and evidence are what pass.", needsFocus:"significance,certainty" },
  { id:"diff-ignored", category:"difficult", title:"When Nobody Talks to You", desc:"Recover from being ignored or brushed off, and make the next approach anyway.", skills:["Confidence","Rapport"], role:"Initially Uninterested Attendee", scene:"It has been a bruising twenty minutes: one group closed ranks as you approached, one person gave you a single word and turned away. The voice saying 'leave' is getting louder. You choose one more approach: an attendee who initially seems uninterested, giving you very little. This is the resilience rep. Warmth, a genuine question, and persistence without neediness can turn it; and even if it stays flat, exiting with dignity is the win.", needsFocus:"significance,connection,certainty" },
  { id:"diff-objections", category:"difficult", title:"The Polite Objections", desc:"Handle the classic brush-offs: we have tried it before, there is no budget, we do not have those problems.", skills:["Confidence","Questions"], role:"Politely Objecting Attendee", scene:"The attendee is friendly but armoured, and the objections come in sequence: we have tried something like that before and it did not stick; honestly there is no budget this year; and anyway, we do not really have those problems. None of it is hostile, and all of it is familiar. Arguing loses the relationship; folding loses the opportunity. The skill is curiosity over combat: good questions that open what sits behind each objection, and the patience to let interest grow on their side of the table.", needsFocus:"certainty,significance,connection" },
  { id:"diff-name-blank", category:"difficult", title:"Recovering from a Name Blank", desc:"Handle the moment someone greets you warmly by name and you have completely blanked on theirs.", skills:["Rapport","Flow"], role:"Attendee You Have Met Before", scene:"Someone crosses the room, greets you warmly by name, and references your last conversation in detail. You remember their face, the event, even what they told you about their business. Their name is gone. The clumsy move makes it worse; the honest, light-touch recovery makes it human. Navigate the moment and rebuild the thread.", needsFocus:"connection,significance" },
  { id:"diff-silence", category:"difficult", title:"Rescuing an Awkward Silence", desc:"Recover a conversation that has stalled with someone reserved, without filling the air with noise.", skills:["Questions","Listening"], role:"Reserved Attendee", scene:"The conversation has run dry. The attendee you are with gives short answers, volunteers nothing, and the silences are stretching. They are not hostile, just closed. Panic-filling with chatter makes it worse. Good open questions, patience with the pauses, and genuine interest are what open reserved people. See what is underneath.", needsFocus:"connection,certainty" },
  { id:"diff-exit", category:"difficult", title:"Leaving a Conversation Politely", desc:"End a pleasant conversation cleanly, so both of you leave feeling good about it.", skills:["Flow","Rapport"], role:"Talkative Attendee", scene:"The conversation has been perfectly pleasant and has now run its course, but the other person shows no sign of wrapping up, and the room is full of people you have not met. Most people stay trapped for fear of rudeness. The skill is the warm close: appreciation, a forward gesture, a clean exit that leaves the relationship better than an endless goodbye would.", needsFocus:"connection,certainty" },
  { id:"follow-coffee", category:"followup", title:"The Follow-Up Coffee Meeting", desc:"Turn a promising event connection into a real relationship over coffee a week later.", skills:["Rapport","Questions"], role:"New Contact from the Event", scene:"You met this person at last week's event, the conversation was genuinely good, and the coffee you suggested is now happening. There is no room noise, no time pressure, and no script. The skill is moving from event acquaintance to actual professional relationship: deeper questions, real listening, and by the end, a natural sense of how you might be useful to each other.", needsFocus:"connection,growth,contribution" },
  { id:"follow-meeting", category:"followup", title:"Turning a Contact into a Meeting", desc:"Move a warm contact toward a proper business conversation without sounding needy or salesy.", skills:["Clarity","Confidence"], role:"Warm Contact", scene:"You have met this person twice at events and the rapport is real. There is a genuine business reason to talk properly: a project where you could help. You have caught them for five minutes. Asking for the meeting feels like crossing a line from friendly to needy. It is not, if the ask is specific, low pressure, and framed around their interest. Make it.", needsFocus:"significance,certainty,contribution" },
  { id:"follow-referral", category:"followup", title:"Generating a Referral", desc:"Ask a warm contact who values your work to refer you, specifically enough that they actually can.", skills:["Clarity","Rapport"], role:"Warm Contact Who Rates You", scene:"You are having coffee with a contact who genuinely rates what you do; they have said so more than once. They would refer you if they knew how. Most people never ask, or ask so vaguely ('if you know anyone...') that nothing ever comes. The skill is the specific, easy ask: who exactly, what to say, and how to make the introduction effortless for them.", needsFocus:"contribution,significance,connection" },
  { id:"follow-reconnect", category:"followup", title:"Reconnecting After Months of Silence", desc:"Restart a relationship that went quiet, without the apology spiral or the pretence that no time has passed.", skills:["Rapport","Flow"], role:"Dormant Contact", scene:"Across the room is someone you connected well with almost a year ago. You said you would stay in touch. Neither of you did. The temptation is either to avoid them or to over-apologise. Both waste a warm connection. Approach, acknowledge the gap lightly, and pick the relationship back up where the goodwill still lives.", needsFocus:"connection,significance" },
];

const NEEDS_PROMPT = `HUMAN NEEDS AWARENESS: Every person in a workplace conversation is trying to meet fundamental human needs. Hold all six simultaneously and subtly honour the ones most at risk.
- CERTAINTY: they need safety, to know what happens next. When at risk they become rigid or shut down.
- VARIETY: they need possibility and openness, not dead ends.
- SIGNIFICANCE: they need to feel they matter and are not being written off. Protect this even in difficult conversations.
- CONNECTION: the sense someone is genuinely on their side and they are not alone.
- GROWTH: this conversation should move them forward, not just hold them accountable.
- CONTRIBUTION: their work means something, there is purpose to step up for.
ETHICAL FOUNDATION: This tool exists to build people up. Never corner, shame or win at the expense of the person practising. Even in resistant or dismissive mode, remain a professional who ultimately respects the person opposite you.
LANGUAGE RULE: NEVER use em dashes (the — character) under any circumstances whatsoever. Not once. Not ever. Replace every em dash with a comma, full stop, or colon. This is an absolute rule with no exceptions. Always use the Oxford comma in lists of three or more items (for example: certainty, growth, and contribution).`;

  rushed: "You have about two minutes before you genuinely need to move on: another conversation, a talk starting, a train to catch. Say so early and politely. Compress everything. If the person makes those two minutes count with crisp, memorable communication, become interested enough to offer a follow-up: a card, a coffee, a connection request. If they ramble, exit warmly but firmly.",

const TONE_ETHIC = "TONE RULE: Whatever the tone, you are always a character the person can succeed against. There is always a path through. If they communicate well, respond to it. Never become an immovable wall, never punish good communication, and never escalate beyond professional realism.";

function getToneMeta(v) {
  for (const g of TONE_GROUPS) {
    const t = g.tones.find(t => t.value === v);
    if (t) return { ...t, group: g.label };
  }
  return { value: v, label: v, note: "", group: "" };
}

function LevelPicker({ label, options, value, onChange, isOpen, onToggle, accent }) {
  const selected = options.find(o => o.value === value);
  const ac = accent || TEAL;
  return (
    <div style={{ marginBottom:16 }}>
      <label style={{ ...s.fieldLabel, marginBottom:8, display:"block" }}>{label}</label>
      <div style={{ border:`1px solid ${ac}55`, borderLeft:`5px solid ${ac}`, borderRadius:8, overflow:"hidden" }}>
        <button
          onClick={onToggle}
          style={{ width:"100%", display:"flex", alignItems:"center", gap:10, padding:"14px 15px", background:`${ac}14`, border:"none", cursor:"pointer", color:"#EEF8F9", textAlign:"left", fontFamily:"'DM Sans', Arial, sans-serif" }}>
          <span style={{ fontSize:"clamp(14px, 2.1vw, 17px)", fontWeight:700, color:ac }}>{selected ? selected.label : "Choose"}</span>
          <span style={{ fontSize:"clamp(12px, 1.9vw, 14px)", color:"rgba(232,244,245,0.65)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{selected ? selected.note : ""}</span>
          <span style={{ marginLeft:"auto", fontSize:11, color:"rgba(232,244,245,0.6)", transform:isOpen ? "rotate(180deg)" : "none", transition:"transform 0.2s", flexShrink:0 }}>▼</span>
        </button>
        {isOpen && (
          <div style={{ ...s.toneGrid, padding:"4px 10px 12px" }}>
            {options.map(o => (
              <button key={o.value} style={{ ...s.toneBtn, ...(value===o.value ? s.toneBtnActive : {}) }} onClick={() => { onChange(o.value); onToggle(); }}>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", fontWeight:500, marginBottom:3 }}>{o.label}</div>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", color:"rgba(232,244,245,0.75)" }}>{o.note}</div>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

  async function callAI(systemPrompt, msgs) {
    const url = PROXY_BASE_URL ? `${PROXY_BASE_URL}/api/claude` : "https://api.anthropic.com/v1/messages";
    const res = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system:systemPrompt, messages:msgs })
    });
    const data = await res.json();
    const raw = data.content?.find(b => b.type === "text")?.text || "";
    // Strip em dashes and asterisk stage directions
    return raw
      .replace(/\s*—\s*/g, ", ")
      .replace(/,\s*,/g, ",")
      .replace(/\*[^*]*\*/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // ── SPEECH INPUT ──
  function beginRecognitionSession() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = true; // keeps listening through pauses — see merge logic below for why this is now safe
    recognition.interimResults = true;
    recognition.lang = "en-GB";

    recognition.onstart = () => setIsListening(true);

    // This engine sometimes marks a growing restatement of the SAME utterance as
    // "final" more than once ("how" -> "how you" -> "how you doing"), and sometimes
    // marks a genuinely NEW, separate chunk as final ("how you doing" -> "because you
    // have had a lot on your plate"). Those need opposite handling: a restatement
    // should REPLACE what came before, new content should be APPENDED to it. Blindly
    // replacing on every final result (an earlier version of this code) caused real
    // content to be silently dropped whenever the engine produced a genuinely new
    // chunk instead of a restatement. The fix: check whether the new text starts with
    // what we already have. If it does, it's a restatement, replace. If it doesn't,
    // it's new, append.
    let instanceFinal = "";
    recognition.onresult = (e) => {
      if (!e.results.length) return;
      const last = e.results[e.results.length - 1];
      const text = last[0].transcript.trim();
      if (last.isFinal && text) {
        const prevLower = instanceFinal.toLowerCase();
        const textLower = text.toLowerCase();
        if (!instanceFinal || textLower.startsWith(prevLower)) {
          instanceFinal = text; // restatement (or first chunk) — replace
        } else {
          instanceFinal = instanceFinal + " " + text; // not a clean restatement — treat as new content, append rather than risk dropping it
        }
      }
      const interimPart = last.isFinal ? "" : text;
      const combined = [baseInputRef.current, sessionFinalRef.current, instanceFinal, interimPart]
        .filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
      setInput(combined);
      voiceInputRef.current = combined; // update immediately, don't wait on React's render cycle
    };

    recognition.onend = () => {
      // Bank whatever this instance finalized exactly once, before it's discarded.
      if (instanceFinal) {
        sessionFinalRef.current = sessionFinalRef.current ? sessionFinalRef.current + " " + instanceFinal : instanceFinal;
      }
      if (manualStopRef.current) {
        setIsListening(false);
        if (autoSendRef.current) {
          autoSendRef.current = false;
          const finalText = voiceInputRef.current.trim();
          if (finalText) sendMessageRef.current(finalText);
        }
      } else {
        // Belt-and-braces: some mobile browsers end a "continuous" session on their
        // own after a pause regardless of the flag above. If that happens and the
        // person hasn't pressed Stop, silently start a new session so listening
        // resumes rather than quietly going dead. With continuous:true this should be
        // rare in normal use, which is what keeps handoff gaps (and the words lost in
        // them) rare too.
        beginRecognitionSession();
      }
    };

    recognition.onerror = (e) => {
      if (e.error === "no-speech") return; // a pause, not a real error — onend will decide what happens next
      if (!manualStopRef.current && (e.error === "aborted" || e.error === "network")) return; // onend will restart it
      manualStopRef.current = true;
      setIsListening(false);
    };

    recognitionRef.current = recognition;
    recognition.start();
  }

  function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Voice input is not supported in this browser. Please use Chrome or Edge.");
      return;
    }
    if (recognitionRef.current) { recognitionRef.current.stop(); }
    manualStopRef.current = false;
    baseInputRef.current = input.trim(); // capture what is already typed
    sessionFinalRef.current = "";
    beginRecognitionSession();
  }

  function stopListening(autoSend = false) {
    autoSendRef.current = autoSend;
    manualStopRef.current = true;
    if (recognitionRef.current) {
      // .stop() is asynchronous — the engine still delivers any final result(s) before
      // onend fires. Sending happens from onend, never from a fixed delay, so it never
      // races ahead of the transcript actually arriving.
      recognitionRef.current.stop();
      recognitionRef.current = null;
    } else {
      setIsListening(false);
    }
  }

  // ── SPEECH OUTPUT — mirrors Biscuit's proven approach ──
  function stopSpeaking() {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.onended = null;
      audioRef.current.onerror = null;
      audioRef.current = null;
    }
    window.speechSynthesis.cancel();
    setIsSpeaking(false);
  }

  // Biscuit-style: single fetch, play immediately, onended handles state
  // For long narrator text only, we pre-split into sentences and chain them
  async function speakText(text, isNarrator = false) {
    if (!voiceEnabledRef.current) return;
    if (!PROXY_BASE_URL) return;

    // Clean text — strip stage directions and asterisks
    const cleanText = text
      .replace(/\*[^*]*\*/g, "")
      .replace(/\s+/g, " ")
      .trim();
    if (!cleanText) return;

    // Stop anything currently playing — same as Biscuit's stopSpeak()
    stopSpeaking();

    const voiceConfig = isNarrator
      ? NARRATOR_VOICE
      : (VOICE_MAP[scenario?.category] || VOICE_MAP.default)[characterGender];

    setIsSpeaking(true);

    // For short text (character replies) — single call like Biscuit
    // For long text (narrator scene) — split at sentence boundaries and chain
    const MAX_LEN = 800;
    const segments = cleanText.length <= MAX_LEN
      ? [cleanText]
      : (cleanText.match(/[^.!?]+[.!?]+|\S+/g) || [cleanText]).reduce((acc, s) => {
          const last = acc[acc.length - 1];
          if (last && (last + s).length <= MAX_LEN) { acc[acc.length - 1] = last + s; }
          else acc.push(s);
          return acc;
        }, []);

    // Play segments in sequence — fetch next while current is playing
    const playSegment = async (index) => {
      if (index >= segments.length || !voiceEnabledRef.current) {
        setIsSpeaking(false);
        return;
      }
      try {
        const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: segments[index], voice_id: voiceConfig.id })
        });
        if (!response.ok) throw new Error("ElevenLabs error");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audioRef.current = audio;
        audio.onended = () => {
          URL.revokeObjectURL(url);
          playSegment(index + 1); // chain next segment
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          setIsSpeaking(false);
        };
        audio.play();
      } catch {
        setIsSpeaking(false);
      }
    };

    playSegment(0);
  }

  // speakTextAndWait — used in startLab/restartLab to await full completion
  // before moving to next step (narrator must finish before character speaks)
  function speakTextAndWait(text, isNarrator = false) {
    return new Promise((resolve) => {
      if (!voiceEnabledRef.current || !PROXY_BASE_URL) { resolve(); return; }

      const cleanText = text.replace(/\*[^*]*\*/g, "").replace(/\s+/g, " ").trim();
      if (!cleanText) { resolve(); return; }

      stopSpeaking();

      const voiceConfig = isNarrator
        ? NARRATOR_VOICE
        : (VOICE_MAP[scenario?.category] || VOICE_MAP.default)[characterGender];

      setIsSpeaking(true);

      const MAX_LEN = 800;
      const segments = cleanText.length <= MAX_LEN
        ? [cleanText]
        : (cleanText.match(/[^.!?]+[.!?]+|\S+/g) || [cleanText]).reduce((acc, s) => {
            const last = acc[acc.length - 1];
            if (last && (last + s).length <= MAX_LEN) { acc[acc.length - 1] = last + s; }
            else acc.push(s);
            return acc;
          }, []);

      const playSegment = async (index) => {
        if (index >= segments.length || !voiceEnabledRef.current) {
          setIsSpeaking(false);
          resolve();
          return;
        }
        try {
          const response = await fetch(`${PROXY_BASE_URL}/api/tts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: segments[index], voice_id: voiceConfig.id })
          });
          if (!response.ok) throw new Error("ElevenLabs error");
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audioRef.current = audio;
          audio.onended = () => { URL.revokeObjectURL(url); playSegment(index + 1); };
          audio.onerror = () => { URL.revokeObjectURL(url); setIsSpeaking(false); resolve(); };
          audio.play();
        } catch { setIsSpeaking(false); resolve(); }
      };

      playSegment(0);
    });
  }

              <div style={{ marginBottom:32, background:"rgba(61,133,140,0.08)", border:`1px solid rgba(61,133,140,0.25)`, borderRadius:12, padding:"24px 22px" }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:12 }}>A Stronger Version of That Moment</div>
                <div style={{ fontSize:"clamp(14px, 2.2vw, 18px)", color:"rgba(232,244,245,0.9)", lineHeight:1.75, fontFamily:"'Cormorant Garamond', Georgia, serif", fontStyle:"italic", marginBottom:16 }}>
                  {debrief.alternativeResponse}
                </div>
                <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                  {voiceEnabled && (
                    <button
                      onClick={() => speakText(debrief.alternativeResponse, true)}
                      style={{ padding:"9px 16px", background:"transparent", border:`1px solid rgba(61,133,140,0.3)`, borderRadius:7, color:"rgba(232,244,245,0.75)", fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(12px, 1.8vw, 15px)", cursor:"pointer" }}>
                      🔊 Hear this read aloud
                    </button>
                  )}
                  <button
                    onClick={restartLab}
                    style={{ padding:"9px 16px", background:TEAL, border:"none", borderRadius:7, color:DARKER, fontFamily:"'DM Sans', Arial, sans-serif", fontSize:"clamp(12px, 1.8vw, 15px)", fontWeight:700, cursor:"pointer" }}>
                    Try again with this in mind →
                  </button>
                </div>
              </div>
            )}

            {debrief.skillsLabModule && (
              <div style={{ marginBottom:32, background:"rgba(212,168,83,0.06)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:12, padding:"22px 20px" }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:10 }}>Build the Foundation in the Skills Lab</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)", lineHeight:1.65 }}>
                  {debrief.skillsLabModule === "leadership" && "Your development area points to Leadership Styles. Go to the Rewire Skills Lab to identify your default style and practise adapting it to different situations."}
                  {debrief.skillsLabModule === "communication" && "Your development area points to Communication Styles. Go to the Rewire Skills Lab to build the vocabulary and drill the patterns that will serve you better."}
                  {debrief.skillsLabModule === "executive" && "Your development area points to Executive Presence. Go to the Rewire Skills Lab to build the register and vocabulary of someone who speaks at boardroom level."}
                  {debrief.skillsLabModule === "thinking" && "Your development area points to Thinking Frameworks. Go to the Rewire Skills Lab to sharpen how you think before you decide, argue or solve."}
                </div>
              </div>
            )}

            {debrief.registerNote && (
              <div style={{ marginBottom:28, padding:"16px 20px", background:"rgba(212,168,83,0.07)", border:`1px solid rgba(212,168,83,0.2)`, borderRadius:10 }}>
                <div style={{ fontSize:"clamp(13px, 2.1vw, 17px)", letterSpacing:"0.18em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:8 }}>Register Note</div>
                <div style={{ fontSize:"clamp(13px, 2vw, 16px)", color:"rgba(232,244,245,0.82)", lineHeight:1.65 }}>{debrief.registerNote}</div>
              </div>
            )}

            {debrief.goalOutcome && (
              <div style={{ margin:"0 0 18px", padding:"18px 20px", borderRadius:10, border:"1px solid rgba(61,133,140,0.35)", background:"rgba(61,133,140,0.08)" }}>
                <div style={{ fontSize:12, letterSpacing:"0.15em", textTransform:"uppercase", color:TEAL, fontWeight:600, marginBottom:8 }}>Your Conversation Goal</div>
                <div style={{ fontSize:"clamp(14px, 2.2vw, 17px)", lineHeight:1.6, color:"#EEF8F9" }}>{debrief.goalOutcome}</div>
              </div>
            )}
            {Array.isArray(debrief.lineBank) && debrief.lineBank.length > 0 && (
              <div style={{ margin:"0 0 18px", padding:"18px 20px", borderRadius:10, border:"1px solid rgba(212,168,83,0.4)", background:"rgba(212,168,83,0.07)" }}>
                <div style={{ fontSize:12, letterSpacing:"0.15em", textTransform:"uppercase", color:AMBER, fontWeight:600, marginBottom:6 }}>Your Line Bank</div>
                <div style={{ fontSize:"clamp(12px, 1.9vw, 14px)", color:"rgba(232,244,245,0.65)", marginBottom:10 }}>Your strongest phrases from this practice. Take them into the real room.</div>
                {debrief.lineBank.map((l, i) => (
                  <div key={i} style={{ fontFamily:"'Cormorant Garamond', Georgia, serif", fontStyle:"italic", fontSize:"clamp(16px, 2.5vw, 19px)", color:"#EEF8F9", padding:"7px 0", borderBottom: i < debrief.lineBank.length - 1 ? "1px solid rgba(212,168,83,0.15)" : "none" }}>&ldquo;{l}&rdquo;</div>
                ))}
              </div>
            )}
            <div style={s.debriefActions}>
              <button style={s.debriefBtnPrimary} onClick={restartLab}>Practise This Scenario Again</button>
              <button style={s.debriefBtnSecondary} onClick={() => exportDebriefPDF(debrief)}>Download Debrief</button>
              <button style={s.debriefBtnSecondary} onClick={() => { stopSpeaking(); setView("lobby"); }}>Choose New Scenario</button>
            </div>
          </>
        ) : null}
      </div>
    </div>
  );

  return null;
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>
