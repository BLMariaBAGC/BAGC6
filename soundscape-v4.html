<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond Limits · Soundscape</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#c4956a;
  --acl:#ecd5b0;
  --w:rgba(255,255,255,.92);
  --wd:rgba(255,255,255,.62);
  --wf:rgba(255,255,255,.09)
}
body{background:transparent;font-family:"Lato",sans-serif;padding:0;margin:0}

.pw{
  width:100%;max-width:520px;
  background:linear-gradient(160deg,#1a0e06,#01293A 65%);
  border:1px solid rgba(255,255,255,.12);
  border-radius:6px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.55);
  transition:border-color .4s ease;
}

/* HEADER */
.ph{padding:14px 16px 12px;border-bottom:1px solid var(--wf);position:relative;display:flex;align-items:flex-start;justify-content:space-between}
.ph::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--acl),var(--ac),transparent);opacity:.7;transition:background .4s ease}
.phleft{flex:1;min-width:0}
.hlbl{font-size:9px;font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:var(--ac);margin-bottom:4px;transition:color .4s ease}
.htitle{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:20px;color:var(--w);line-height:1.1}
.htitle em{font-style:italic;color:var(--ac);transition:color .4s ease}
.hnow{font-size:10px;font-weight:300;color:var(--wd);letter-spacing:.04em;margin-top:5px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hnow.vis{display:block}
.colbtn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;transition:color .15s;flex-shrink:0;margin-top:2px}
.colbtn:hover{color:var(--ac)}
.colbtn svg{transition:transform .3s ease}
.colbtn.down svg{transform:rotate(180deg)}

/* DISCOVER */
.discover{max-height:600px;overflow:hidden;transition:max-height .4s ease}
.discover.hidden{max-height:0}

/* CATEGORY PILLS */
.catrow{padding:10px 14px 8px;display:flex;gap:5px;flex-wrap:wrap}
.pill{
  flex-shrink:0;font-size:8.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:20px;
  border:1px solid rgba(255,255,255,.15);
  background:transparent;color:rgba(255,255,255,.45);
  cursor:pointer;transition:all .2s;white-space:nowrap
}
.pill:hover{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.3)}
/* active pill colour set inline via JS */

/* TRACK LIST */
.tlistwrap{border-top:1px solid var(--wf)}
.tscroll{max-height:112px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) rgba(255,255,255,.06)}
.tscroll::-webkit-scrollbar{width:5px}
.tscroll::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:3px}
.tscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
.titem{display:flex;align-items:center;padding:7px 16px;cursor:pointer;transition:background .12s;gap:10px;border-left:2px solid transparent}
.titem:hover{background:rgba(255,255,255,.04)}
.titem.on{background:rgba(255,255,255,.05);border-left-color:var(--ac)}
.tnum{font-size:10px;color:var(--wd);width:16px;flex-shrink:0;font-weight:300;font-variant-numeric:tabular-nums}
.titem.on .tnum{color:var(--ac);transition:color .4s ease}
.tdet{flex:1;min-width:0}
.tname{font-family:"Cormorant Garamond",serif;font-size:13.5px;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tartist{font-size:9.5px;color:var(--wd);font-weight:300;margin-top:1px}
.tdur{font-size:10px;color:var(--wd);font-weight:300;font-variant-numeric:tabular-nums;flex-shrink:0}

/* CONTROL BAR */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--wf)}
.vsmall{flex-shrink:0;width:36px;height:36px;position:relative}
.vdisk{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 50%,#0a0a0a 0%,#0a0a0a 20%,#1c1c1c 20%,#1c1c1c 26%,#111 26%,#111 32%,#1c1c1c 32%,#1c1c1c 38%,#111 38%,#111 44%,#1c1c1c 44%,#1c1c1c 50%);
  box-shadow:0 2px 8px rgba(0,0,0,.5)
}
.vdisk::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--ac);transition:background .4s ease}
.vdisk.spin{animation:spin 4s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.binfo{flex:1;min-width:0}
.btitle{font-family:"Cormorant Garamond",serif;font-size:14px;font-weight:400;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.bsub{font-size:10px;font-weight:300;color:var(--wd);letter-spacing:.04em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bctrl{display:flex;align-items:center;gap:2px;flex-shrink:0}
.ibtn{background:none;border:none;cursor:pointer;color:var(--wd);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;transition:color .15s,transform .12s}
.ibtn:hover{color:var(--acl);transform:scale(1.12)}
.ibtn:active{transform:scale(.9)}
.playbtn{width:40px;height:40px;color:#fff;margin:0 2px;box-shadow:0 2px 14px rgba(0,0,0,.4);transition:background .4s ease,box-shadow .4s ease,transform .12s}
.playbtn:hover{color:#fff;transform:scale(1.08)}

/* PROGRESS */
.prog{padding:4px 16px 10px}
.pbo{height:3px;background:var(--wf);border-radius:2px;cursor:pointer;margin-bottom:6px;overflow:hidden}
.pbi{height:100%;border-radius:2px;width:0%;transition:width .5s linear,background .4s ease}
.trow{display:flex;justify-content:space-between;font-size:10px;font-weight:300;color:var(--wd);letter-spacing:.04em}

/* VOLUME */
.volrow{padding:4px 16px 12px;display:flex;align-items:center;gap:10px}
.vicon{color:rgba(255,255,255,.6);flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acl);cursor:pointer;box-shadow:0 0 6px rgba(255,255,255,.3);transition:background .4s ease}

/* SOUND BARS */
.bars{display:flex;gap:2px;align-items:flex-end;height:12px;flex-shrink:0}
.bbar{width:3px;border-radius:1px;height:3px;background:var(--ac);transition:background .4s ease}
.bars.on .bbar:nth-child(1){animation:b1 .8s ease-in-out infinite}
.bars.on .bbar:nth-child(2){animation:b2 .6s ease-in-out infinite}
.bars.on .bbar:nth-child(3){animation:b3 .9s ease-in-out infinite}
@keyframes b1{0%,100%{height:3px}50%{height:12px}}
@keyframes b2{0%,100%{height:8px}50%{height:3px}}
@keyframes b3{0%,100%{height:5px}50%{height:10px}}

/* FOOTER */
.pf{padding:7px 16px;border-top:1px solid var(--wf);font-size:9px;color:rgba(255,255,255,.2);font-weight:300;letter-spacing:.05em;display:flex;justify-content:space-between}
</style>
</head>

  <div class="ph">

    </button>
  </div>

  <!-- BROWSE (collapsible) -->
  <div class="discover" id="discover">
    <div class="catrow" id="catrow"></div>
    <div class="tlistwrap">
      <div class="tscroll" id="tlist"></div>
    </div>
  </div>

  <!-- CONTROL BAR -->
  <div class="bar">

    <div class="binfo">
      <div class="btitle" id="bTn"></div>
      <div class="bsub"  id="bAr"></div>
    </div>
    <div class="bars" id="bars"><div class="bbar"></div><div class="bbar"></div><div class="bbar"></div></div>
    <div class="bctrl">
      <button class="ibtn" onclick="prev()" title="Previous">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="ibtn playbtn" id="pbtn" onclick="tog()">
        <svg id="ip"  width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="ipa" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ibtn" onclick="next()" title="Next">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="prog">
    <div class="pbo" id="pbo"><div class="pbi" id="pbi"></div></div>
    <div class="trow"><span id="tC">0:00</span><span id="tD">--:--</span></div>
  </div>

  <!-- VOLUME -->
  <div class="volrow">
    <svg class="vicon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.02" value="0.75" oninput="au.volume=parseFloat(this.value)">
  </div>

  <!-- FOOTER -->
  <div class="pf">
    <span>CC0 · Archive.org · Royalty-free tracks</span>
    <span>&copy; Hypnotika Mente Ltd 2026</span>
  </div>

</div>

      {n:'Tip Your Waitress',            a:'', f:'Tip-Your-Waitress-CAB011301.mp3'}
    ]
  },
  '20s': {
    col:'#b8904a', light:'#dfc080',   // vintage brass
    base:'https://archive.org/download/Free_20s_Jazz_Collection/',
    tracks:[
      {n:'Kater Street Rag',      a:'Bennie Moten · 1923',           f:'Bennie_Moten_Kater_St._Rag_64kb.mp3'},
      {n:'Animal Crackers',       a:'California Ramblers · 1923',    f:'CA_Ramblers_Animal_Crackers_64kb.mp3'},
      {n:'Five Foot Two',         a:'Golden Gate Orchestra · 1925',  f:'Golden_Gate_Orch-5_Foot_2_11KHz_64kb.mp3'},
      {n:'Hot Mittens',           a:'Bucktown Five · 1924',          f:'Bucktown_5_Hot_Mittens_64kb.mp3'},
      {n:"Somebody's Wrong",      a:'1920s Jazz Orchestra · 1923',   f:'Somebodys_Wrong_64kb.mp3'},
      {n:'Henpecked Blues',       a:'1920s Jazz Orchestra · 1923',   f:'Henpecked_Blues_64kb.mp3'},
      {n:'Dardanella',            a:'1920s Jazz Orchestra · 1920',   f:'dardanel_64kb.mp3'},
      {n:'Tishomingo Blues',      a:'The Washingtonians · 1925',     f:'Washingtonians-Tishomingo_Blues_11KHz_64kb.mp3'}
    ]
  }
};

// ── STATE ────────────────────────────────────────────────────────────────────
const catKeys  = Object.keys(PLAYLISTS);
let activeCat  = catKeys[0];
let c          = 0;
let pl         = false;
let discOpen   = true;
const au       = document.getElementById('au');

const tracks   = () => PLAYLISTS[activeCat].tracks;
const base     = () => PLAYLISTS[activeCat].base;
const col      = () => PLAYLISTS[activeCat].col;
const light    = () => PLAYLISTS[activeCat].light;

// ── APPLY COLOUR THEME ───────────────────────────────────────────────────────
function applyColour() {
  const r  = document.documentElement;
  const c_ = col(), l = light();
  r.style.setProperty('--ac',  c_);
  r.style.setProperty('--acl', l);
  // play button gradient
  document.getElementById('pbtn').style.background =
    `linear-gradient(135deg, ${c_}, ${darken(c_, 30)})`;
  // card border glows with category colour
  document.getElementById('pw').style.borderColor =
    hexAlpha(c_, .28);
}

// simple hex helpers
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function darken(hex, amt) {
  let r = Math.max(0, parseInt(hex.slice(1,3),16) - amt),
      g = Math.max(0, parseInt(hex.slice(3,5),16) - amt),
      b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ── BUILD PILLS ──────────────────────────────────────────────────────────────
function buildPills() {
  const row = document.getElementById('catrow');
  row.innerHTML = '';
  catKeys.forEach(k => {
    const b   = document.createElement('button');
    const cat = PLAYLISTS[k];
    const on  = k === activeCat;
    b.className   = 'pill';
    b.textContent = k;
    if (on) {
      b.style.background   = `linear-gradient(135deg, ${cat.col}, ${darken(cat.col, 25)})`;
      b.style.borderColor  = 'transparent';
      b.style.color        = '#fff';
      b.style.boxShadow    = `0 2px 10px ${hexAlpha(cat.col, .35)}`;
    }
    b.onclick = () => switchCat(k);
    row.appendChild(b);
  });
}

function switchCat(k) {
  activeCat = k; c = 0;
  applyColour(); buildPills(); build(); load(0, false);
}

// ── BUILD TRACK LIST ─────────────────────────────────────────────────────────
function build() {
  const el = document.getElementById('tlist');
  el.innerHTML = '';
  tracks().forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'titem' + (i === c ? ' on' : '');
    d.innerHTML =
      `<span class="tnum">${String(i+1).padStart(2,'0')}</span>`
    + `<div class="tdet"><div class="tname">${t.n}</div>`
    + (t.a ? `<div class="tartist">${t.a}</div>` : '')
    + `</div><span class="tdur" id="d${i}"></span>`;
    d.onclick = () => load(i, true);
    el.appendChild(d);
  });
}

// ── LOAD TRACK ───────────────────────────────────────────────────────────────
function load(i, auto = false) {
  c = i;
  const t = tracks()[i];
  document.getElementById('bTn').textContent = t.n;
  document.getElementById('bAr').textContent = t.a || activeCat;
  updateNow();
  au.src = base() + t.f;
  au.load();
  document.querySelectorAll('.titem').forEach((el, j) =>
    el.classList.toggle('on', j === c));
  document.getElementById('tD').textContent = '--:--';
  document.getElementById('tC').textContent = '0:00';
  document.getElementById('pbi').style.width = '0%';
  if (auto) { au.play(); set(true); } else set(false);
}

// ── PLAYBACK ─────────────────────────────────────────────────────────────────
function tog() { pl ? au.pause() : au.play(); set(!pl); }
function set(p) {
  pl = p;
  document.getElementById('ip').style.display  = p ? 'none'  : 'block';
  document.getElementById('ipa').style.display = p ? 'block' : 'none';
  document.getElementById('vd').classList.toggle('spin', p);
  document.getElementById('bars').classList.toggle('on', p);
}
function prev() { load((c - 1 + tracks().length) % tracks().length, pl); }
function next() { load((c + 1) % tracks().length, pl); }

// ── COLLAPSE TOGGLE ──────────────────────────────────────────────────────────
function toggleDiscover() {
  discOpen = !discOpen;
  document.getElementById('discover').classList.toggle('hidden', !discOpen);
  document.getElementById('colBtn').classList.toggle('down', !discOpen);
  updateNow();
}
function updateNow() {
  const el = document.getElementById('hnow');
  const t  = tracks()[c];
  if (!discOpen) { el.textContent = activeCat + ' \u00b7 ' + t.n; el.classList.add('vis'); }
  else           { el.classList.remove('vis'); }
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
au.volume = 0.75;
au.addEventListener('timeupdate', () => {
  if (!au.duration) return;
  document.getElementById('pbi').style.width =
    (au.currentTime / au.duration * 100) + '%';
  document.getElementById('tC').textContent = fmt(au.currentTime);
});
au.addEventListener('loadedmetadata', () => {
  document.getElementById('tD').textContent = fmt(au.duration);
  const d = document.getElementById('d' + c);
  if (d) d.textContent = fmt(au.duration);
});
au.addEventListener('ended', next);
document.getElementById('pbo').addEventListener('click', function(e) {
  const r = this.getBoundingClientRect();
  if (au.duration) au.currentTime = ((e.clientX - r.left) / r.width) * au.duration;
});

function fmt(s) {
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
applyColour();
buildPills();
build();
load(0);
</script>
</body>
</html>
